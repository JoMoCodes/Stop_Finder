function showStage(i) {
  currentIndex = i;
  currentStage = STAGES[i];
  for (const b of jumpBtns) b.classList.toggle('active', Number(b.dataset.part) === currentStage.part);
  if (!groups[i]) groups[i] = buildStageGroup(i);
  for (const k in groups) groups[k].visible = (Number(k) === i);
  blanks = groups[i].userData.raycastList;

  closeQuiz();
  ui.next.classList.add('hidden');
  ui.continueBtn.classList.add('hidden');
  ui.back.classList.add('hidden');

  setPrompt(promptFor(currentStage));
  if (currentStage.kind === 'example') {
    ui.continueBtn.textContent = 'Next ▸';
    ui.continueBtn.classList.remove('hidden');
    if (currentIndex > 0) ui.back.classList.remove('hidden');
  } else {
    ui.back.classList.remove('hidden');
  }
  ui.prompt.classList.remove('hidden');

  frameStage(currentStage);
  if (currentStage.kind === 'quiz' && allSolved()) showNext();   // revisiting a finished street
  document.dispatchEvent(new CustomEvent('stagechange', { detail: { index: i, stage: currentStage } }));
}

/* ============================================================
   quiz
   ============================================================ */
const RULE_BY_PART = {
  1: 'Odd on one side, even on the other.',
  2: 'Numbers rise away from the start of the street.',
  3: 'Cross a street and the hundred goes up.',
  4: 'Keep the side, the block and the direction — the gap size does not matter.',
  5: 'Round the court the two sides meet at the far end.',
};
const quizType = () => (currentStage ? currentStage.type : 'street');
const quizPlaces = (val, type) => splitPlaces(String(val), type);

function optionHTML(idx, val, type) {
  const segs = quizPlaces(val, type);
  return `<span class="ltr">${'abcd'[idx]}</span><span class="num">` +
    segs.map(sg => `<span class="pl pl-${sg.place}">${sg.text}</span>`).join('') + '</span>';
}
function renderQuizKey(type) {
  const key = document.getElementById('qkey');
  if (!key) return;
  key.classList.toggle('hidden', !(type === 'block' || type === 'court'));
}
/* which rule a wrong pick broke: the hundred, the side of the street, or the spot along it */
function placeOf(chosen, correct, st) {
  if ((st.type === 'block' || st.type === 'court') && Math.floor(chosen / 100) !== Math.floor(correct / 100)) return 'block';
  if (st.type !== 'loop' && isEven(chosen) !== isEven(correct)) return 'side';
  return 'lot';
}
/* why the pick was wrong, in a short line — never reveals the answer */
function explainWrong(chosen, correct, st) {
  const pl = placeOf(chosen, correct, st);
  if (pl === 'block') return 'Right spot, wrong hundred — the street sign gives the block.';
  if (pl === 'side') return `${chosen} is ${parityWord(chosen)} — that’s the other side of the street.`;
  if (st.type === 'loop') return 'One run round the loop — count on by one from the house next door.';
  if (st.gaps) return 'Right side and block — but it must sit between its neighbours.';
  if (st.part === 2) return 'Right side — check which way the numbers climb, then count on by two.';
  if (st.type === 'court') return 'Right side — follow that side round the bulb, counting by two.';
  if (st.type === 'block') return 'Right side and block — count on by two from the house next door.';
  return 'Right side — count on by two from the house next door.';
}

let quizCloseTimer = null;
function cancelAutoClose() {
  if (quizCloseTimer !== null) { clearTimeout(quizCloseTimer); quizCloseTimer = null; }
}
function armAutoClose(bstate) {
  cancelAutoClose();
  quizCloseTimer = setTimeout(() => {
    quizCloseTimer = null;
    if (activeBlank && activeBlank !== bstate) return;
    const reading = ui.quiz.matches(':hover') || ui.quiz.contains(document.activeElement);
    if (reading) return;
    closeQuiz();
  }, 1100);
}
document.getElementById('qclose').onclick = () => closeQuiz();

function openQuiz(bstate) {
  if (bstate.solved) return;
  cancelAutoClose();
  activeBlank = bstate;
  const type = quizType();
  ui.qhead.innerHTML = 'Which house is this?<small>Pick the number that fits the pattern</small>';
  renderQuizKey(type);
  ui.qopts.innerHTML = '';
  bstate.options.forEach((val, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = optionHTML(idx, val, type);
    btn.onclick = ev => chooseOption(bstate, val, btn, ev);
    ui.qopts.appendChild(btn);
  });
  ui.qmsg.textContent = '';
  ui.qmsg.className = '';
  ui.quiz.classList.remove('hidden');
  document.dispatchEvent(new CustomEvent('quizopen', { detail: { bstate, type } }));
}
function chooseOption(bstate, val, btn, ev) {
  if (bstate !== activeBlank || bstate.solved) return;
  const type = quizType();
  if (val === bstate.value) {
    bstate.solved = true;
    for (const p of bstate.plates) setPlateText(p, String(val));
    btn.classList.add('right');
    document.dispatchEvent(new CustomEvent('answer', { detail: {
      bstate, picked: val, correct: true, attempt: (bstate.wrongCount || 0) + 1, type,
    } }));
    [...ui.qopts.children].forEach(b => b.disabled = true);
    ui.qmsg.textContent = `✓ Correct — ${val}`;
    ui.qmsg.className = 'ok';
    if (ev && ev.detail > 0 && document.activeElement === btn) btn.blur();
    checkComplete(bstate);
    if (activeBlank === bstate) armAutoClose(bstate);
  } else {
    btn.disabled = true;
    btn.classList.add('wrong');
    bstate.wrongCount = (bstate.wrongCount || 0) + 1;
    const place = placeOf(val, bstate.value, currentStage);
    document.dispatchEvent(new CustomEvent('answer', { detail: {
      bstate, picked: val, correct: false, attempt: bstate.wrongCount, type, place,
      chosen: quizPlaces(val, type), expected: quizPlaces(bstate.value, type),
    } }));
    let msg = explainWrong(val, bstate.value, currentStage);
    const rule = currentStage && (currentStage.type === 'loop' ? 'One run round the loop, by one.' : RULE_BY_PART[currentStage.part]);
    if (bstate.wrongCount >= 2 && rule) msg += ' ' + rule;
    ui.qmsg.textContent = msg;
    ui.qmsg.className = 'bad';
  }
}
function closeQuiz() {
  cancelAutoClose();
  activeBlank = null;
  ui.quiz.classList.add('hidden');
  document.dispatchEvent(new CustomEvent('quizclose', { detail: {} }));
}

function checkComplete(bstate) {
  if (bstate) {
    popPlate(bstate);
    markSolved(bstate);
    document.dispatchEvent(new CustomEvent('blanksolved', { detail: { bstate, index: currentIndex } }));
  }
  if (!allSolved()) return;
  markStageComplete(currentIndex);
  if (!celebrated.has(currentIndex)) {
    celebrated.add(currentIndex);
    if (completed.size === STAGES.length) fireFinale();
    else fireConfetti('');
  }
  showNext();
}
function showNext() {
  const isLast = currentIndex === STAGES.length - 1;
  const nextStage = STAGES[currentIndex + 1];
  if (isLast) {
    const fi = firstIncomplete();
    ui.next.textContent = fi === -1 ? 'Start over ▸' : `Finish Part ${STAGES[fi].part} ▸`;
  }
  else if (nextStage && nextStage.kind === 'example') ui.next.textContent = `Next: Part ${nextStage.part} ▸`;
  else ui.next.textContent = 'Next ▸';
  ui.next.classList.remove('hidden');
}

/* ============================================================
   reward + progress
   ============================================================ */
const REDUCED = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function popPlate(bstate) {
  if (!bstate) return;
  const reduced = REDUCED();
  const white = new THREE.Color(0xffffff), tint = new THREE.Color(0xc8ffd8);
  const outBack = x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
  requestAnimationFrame(() => {
    const t0 = performance.now();
    (function step(t) {
      const e = t - t0;
      for (const p of bstate.plates) {
        if (!reduced) {
          const k = Math.min(1, e / 320);
          const bump = k < 0.5 ? outBack(k / 0.5) : 1 - (k - 0.5) / 0.5;
          const sc = 1 + 0.18 * bump;
          p.scale.set(sc, sc, 1);
        }
        if (p.material && p.material.color) p.material.color.copy(white).lerp(tint, Math.sin(Math.PI * Math.min(1, e / 500)));
      }
      if (e < 500) requestAnimationFrame(step);
      else for (const p of bstate.plates) { p.scale.set(1, 1, 1); if (p.material && p.material.color) p.material.color.copy(white); }
    })(performance.now());
  });
  if (!reduced) plateBurst(bstate.plate);
}
function markSolved(bstate) {
  for (const p of (bstate ? bstate.plates : [])) {
    if (!p || p.userData.solvedDot) continue;
    const par = p.geometry && p.geometry.parameters;
    if (!par) continue;
    const pw = par.width, ph = par.height;
    const dot = new THREE.Mesh(new THREE.CircleGeometry(ph * 0.14, 20),
      new THREE.MeshBasicMaterial({ color: 0x57c97e, fog: false }));
    dot.position.set(pw / 2 - ph * 0.18, ph / 2 - ph * 0.18, 0.004);
    p.add(dot);
    p.userData.solvedDot = dot;
  }
}

const completed = new Set();
const progressEl = document.getElementById('progress');
const jbTitleEl = document.querySelector('#jumpbar .jbtitle');
const progSegs = STAGES.map((st, i) => {
  const seg = document.createElement('span');
  seg.className = 'seg' + (i > 0 && st.part !== STAGES[i - 1].part ? ' part' : '');
  if (progressEl) progressEl.appendChild(seg);
  return seg;
});
function updateProgress() {
  for (let i = 0; i < progSegs.length; i++) {
    const done = completed.has(i);
    progSegs[i].classList.toggle('done', done);
    progSegs[i].classList.toggle('now', !done && i === currentIndex);
  }
  if (jbTitleEl && currentIndex >= 0)
    jbTitleEl.textContent = `Part ${STAGES[currentIndex].part} · Street ${currentIndex + 1} of ${STAGES.length}`;
}
function markStageComplete(i) {
  completed.add(i); updateProgress();
  document.dispatchEvent(new CustomEvent('stagecomplete', { detail: { index: i, stage: STAGES[i] } }));
}
document.addEventListener('stagechange', updateProgress);
function firstIncomplete() {
  for (let i = 0; i < STAGES.length; i++) if (!completed.has(i)) return i;
  return -1;
}

/* ---- end of the run ---- */
const finaleEl = document.getElementById('finale');
let finaleShown = false;
function fireFinale() {
  if (finaleShown) return;
  finaleShown = true;
  document.dispatchEvent(new CustomEvent('coursecomplete', { detail: {} }));
  fireConfetti('cannons');
  showFinale();
}
function showFinale() {
  if (!finaleEl) return;
  const open = () => finaleEl.classList.remove('hidden');
  if (REDUCED()) open(); else setTimeout(open, 900);
}
function hideFinale() { if (finaleEl) finaleEl.classList.add('hidden'); }
const fcloseBtn = document.getElementById('fclose');
if (fcloseBtn) fcloseBtn.onclick = hideFinale;
const fagainBtn = document.getElementById('fagain');
if (fagainBtn) fagainBtn.onclick = () => { hideFinale(); resetCourse(); showStage(0); };
addEventListener('keydown', e => {
  if (e.key === 'Escape' && finaleEl && !finaleEl.classList.contains('hidden')) hideFinale();
});

function disposeGroup(g) {
  scene.remove(g);
  g.traverse(o => {
    if (o.geometry && o.geometry !== CHEV_GEO && o.geometry !== CHEV_HIT) o.geometry.dispose();
    if (o.material) { if (o.material.map && o.material.map !== ASPHALT) o.material.map.dispose(); o.material.dispose(); }
  });
}
/* "Try Part N again" from the report: rebuild only that part's streets */
function retryPart(p) {
  hideFinale();
  const stagesReset = [];
  for (let i = 0; i < STAGES.length; i++) {
    if (STAGES[i].part !== p) continue;
    stagesReset.push(i);
    if (groups[i]) { disposeGroup(groups[i]); delete groups[i]; }
    completed.delete(i);
    celebrated.delete(i);
  }
  if (!stagesReset.length) return;
  finaleShown = false;
  updateProgress();
  document.dispatchEvent(new CustomEvent('partreset', { detail: { part: p, stages: stagesReset } }));
  showStage(stagesReset[0]);
}
document.addEventListener('retrypart', e => {
  const p = Number(e.detail && e.detail.part);
  if (p >= 1 && p <= 5) retryPart(p);
});
function resetCourse() {
  for (const k of Object.keys(groups)) { disposeGroup(groups[k]); delete groups[k]; }
  celebrated.clear();
  completed.clear();
  finaleShown = false;
  hideFinale();
  document.dispatchEvent(new CustomEvent('coursereset', { detail: {} }));
}
ui.continueBtn.onclick = () => {
  markStageComplete(currentIndex);
  if (completed.size === STAGES.length) fireFinale();
  showStage(currentIndex + 1);
};
ui.back.onclick = () => showStage(Math.max(0, currentIndex - 1));
ui.next.onclick = () => {
  if (currentIndex < STAGES.length - 1) showStage(currentIndex + 1);
  else {
    const fi = firstIncomplete();
    if (fi === -1) { hideFinale(); resetCourse(); showStage(0); }
    else showStage(fi);
  }
};

/* ============================================================
   discoverability: halos behind unsolved plates, hover tint, cursor,
   the "N houses left" chip, the first-run hint and the ? button
   ============================================================ */
let hovered = null, hoverPt = null, hoverDirty = false, hoveredChevron = null;
let hintOnDrag = null;
{
  const chip = document.getElementById('doorsleft');
  const hint = document.getElementById('draghint');
  const helpBtn = document.getElementById('helpbtn');
  const HINT_FULL = hint.innerHTML;
  const HINT_TIP = '<div>Click a house marked <b>?</b> — the glowing ones. Walk closer with the road arrows.</div>';
  const isQuizStage = () => !!currentStage && currentStage.kind === 'quiz';
  const quizIsOpen = () => !ui.quiz.classList.contains('hidden');

  function addHalo(bs) {
    if (!bs || bs.solved) return;
    bs.halos = bs.halos || [];
    for (const p of bs.plates) {
      if (p.userData.halo || !p.geometry.parameters) continue;
      const { width: pw, height: ph } = p.geometry.parameters;
      const halo = new THREE.Mesh(new THREE.PlaneGeometry(pw * 1.16, ph * 1.4),
        new THREE.MeshBasicMaterial({ color: 0xffd54a, transparent: true, opacity: 0.55, depthWrite: false, fog: false }));
      halo.position.z = -0.006;
      halo.renderOrder = -1;
      p.add(halo);
      p.userData.halo = halo;
      bs.halos.push(halo);
    }
  }
  function clearBlank(bs) {
    if (!bs) return;
    for (const p of bs.plates) {
      if (p.userData.halo) { p.remove(p.userData.halo); p.userData.halo.geometry.dispose(); p.userData.halo.material.dispose(); p.userData.halo = null; }
      if (p.material) { p.material.color.set('#ffffff'); p.scale.set(1, 1, 1); }
    }
    bs.halos = [];
    if (hovered === bs) hovered = null;
  }
  function updateChip(ud) {
    if (!ud || !isQuizStage()) { chip.className = 'hidden'; return; }
    const left = ud.blankStates.filter(s => !s.solved).length;
    if (left > 0) { chip.className = ''; chip.innerHTML = `<b>${left}</b> house${left === 1 ? '' : 's'} left`; }
    else { chip.className = 'done'; chip.textContent = 'Done ✓'; }
  }
  let stageIndex = -1, chipSig = '';
  function onStage() {
    const ud = curUD();
    if (!ud) return;
    stageIndex = currentIndex;
    if (isQuizStage()) for (const s of ud.blankStates) if (!s.solved) addHalo(s);
    chipSig = '';
    tipAt = performance.now();
    tipUsed = false;
    firstRunHint();
  }
  function reconcile(now) {
    const ud = curUD();
    if (!ud) return;
    if (currentIndex !== stageIndex) onStage();
    for (const s of ud.blankStates) if (s.solved && ((s.halos && s.halos.length) || s === hovered)) clearBlank(s);
    const sig = currentIndex + ':' + ud.blankStates.reduce((n, s) => n + (s.solved ? 1 : 0), 0) + ':' + (isQuizStage() ? 'q' : 'e');
    if (sig !== chipSig) { chipSig = sig; updateChip(ud); }
    tipCheck(now, ud);
  }
  document.addEventListener('stagechange', () => onStage());
  document.addEventListener('blanksolved', e => clearBlank(e.detail && e.detail.bstate));

  function updateHover() {
    hoverDirty = false;
    const hit = (hoverPt && !dragging) ? pickAt(hoverPt.x, hoverPt.y) : null;
    const bs = hit && hit.bstate ? hit.bstate : null;
    const ch = hit && hit.chevron ? hit.chevron : null;
    if (bs !== hovered) {
      if (hovered) for (const p of hovered.plates) { p.material.color.set('#ffffff'); p.scale.set(1, 1, 1); }
      hovered = bs;
      if (hovered) for (const p of hovered.plates) { p.material.color.set('#fff1c2'); p.scale.set(1.06, 1.06, 1); }
    }
    if (ch !== hoveredChevron) {
      if (hoveredChevron) { hoveredChevron.userData.arrow.material.opacity = 0.82; hoveredChevron.scale.setScalar(0.78); }
      hoveredChevron = ch;
      if (hoveredChevron) { hoveredChevron.userData.arrow.material.opacity = 1; hoveredChevron.scale.setScalar(0.9); }
    }
    if (!dragging) canvas.style.cursor = (hovered || hoveredChevron || (hit && hit.node !== undefined)) ? 'pointer' : 'grab';
  }

  let hintTimer = 0, hideTimer = 0, firstStage = true, awaitingDrag = false;
  let tipAt = 0, tipUsed = false;
  const seen = {
    get() { try { return localStorage.getItem('sf.houses.hintSeen') === '1'; } catch (e) { return false; } },
    set() { try { localStorage.setItem('sf.houses.hintSeen', '1'); } catch (e) { /* private mode */ } },
  };
  function showHint(html, ms) {
    clearTimeout(hintTimer); clearTimeout(hideTimer);
    hint.innerHTML = html;
    hint.classList.remove('hidden');
    requestAnimationFrame(() => hint.classList.add('show'));
    hintTimer = setTimeout(hideHint, ms);
  }
  function hideHint() {
    clearTimeout(hintTimer);
    if (awaitingDrag) { awaitingDrag = false; seen.set(); }
    hint.classList.remove('show');
    hideTimer = setTimeout(() => { if (!hint.classList.contains('show')) hint.classList.add('hidden'); }, 340);
  }
  function firstRunHint() {
    if (!firstStage) return;
    firstStage = false;
    if (seen.get()) return;
    awaitingDrag = true;
    showHint(HINT_FULL, 8000);
  }
  function tipCheck(now, ud) {
    if (tipUsed || !isQuizStage()) return;
    if (quizIsOpen() || hint.classList.contains('show') || ud.blankStates.some(s => s.solved)) { tipAt = now; return; }
    if (now - tipAt > 12000) { tipUsed = true; showHint(HINT_TIP, 5000); }
  }
  hintOnDrag = () => { if (hint.classList.contains('show')) hideHint(); };
  helpBtn.addEventListener('click', () => showHint(HINT_FULL, 6000));

  (function pulse(now) {
    requestAnimationFrame(pulse);
    reconcile(now);
    if (hoverDirty) updateHover();
    const ud = curUD();
    if (!ud) return;
    const o = reduceMotionMQ.matches ? 0.6 : 0.35 + 0.3 * (0.5 + 0.5 * Math.sin(now / 1000 * Math.PI * 2 * 0.9));
    for (const s of ud.blankStates) if (s.halos) for (const h of s.halos) h.material.opacity = (s === hovered ? 0.9 : o);
  })(performance.now());
}

/* ============================================================
   confetti (2D canvas overlay)
   ============================================================ */
const cc = document.createElement('canvas');
cc.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:39';
document.body.appendChild(cc);
const cctx = cc.getContext('2d');
function sizeConfetti() { cc.width = innerWidth; cc.height = innerHeight; }
sizeConfetti();
let confetti = [];
const CONFETTI_COLORS = ['#ff5252', '#ffd54a', '#57c97e', '#42a5f5', '#ab47bc', '#ff9800'];
function fireConfetti(mode) {
  if (REDUCED()) return;
  const colors = CONFETTI_COLORS;
  if (mode === 'cannons') {
    for (const side of [0, 1]) {
      const dir = side === 0 ? 1 : -1;
      for (let i = 0; i < 120; i++) confetti.push({
        x: side === 0 ? 0 : innerWidth, y: innerHeight * 0.8,
        vx: dir * (6 + Math.random() * 8), vy: -12 - Math.random() * 6, g: 0.22 + Math.random() * 0.12,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.45, w: 6 + Math.random() * 7, h: 8 + Math.random() * 9,
        color: colors[i % colors.length],
      });
    }
    return;
  }
  for (let i = 0; i < 170; i++) confetti.push({
    x: innerWidth / 2 + (Math.random() - 0.5) * 240, y: innerHeight * 0.32,
    vx: (Math.random() - 0.5) * 10, vy: -7 - Math.random() * 9, g: 0.22 + Math.random() * 0.12,
    rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.45, w: 6 + Math.random() * 7, h: 8 + Math.random() * 9,
    color: colors[i % colors.length],
  });
}
function plateBurst(plate) {
  if (REDUCED() || !plate) return;
  const v = plate.getWorldPosition(new THREE.Vector3()).project(camera);
  if (v.z > 1 || Math.abs(v.x) > 1.2 || Math.abs(v.y) > 1.2) return;
  const x = (v.x * 0.5 + 0.5) * innerWidth, y = (-v.y * 0.5 + 0.5) * innerHeight;
  const colors = ['#57c97e', '#7ee0a0', '#ffd54a'];
  for (let i = 0; i < 14; i++) confetti.push({
    x: x + (Math.random() - 0.5) * 26, y: y + (Math.random() - 0.5) * 16,
    vx: (Math.random() - 0.5) * 4, vy: -4 - Math.random() * 3, g: 0.16 + Math.random() * 0.08,
    rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.5, w: 4 + Math.random() * 2, h: 4 + Math.random() * 2,
    color: colors[i % colors.length],
  });
}
function drawConfetti() {
  cctx.clearRect(0, 0, cc.width, cc.height);
  if (!confetti.length) return;
  confetti = confetti.filter(p => p.y < innerHeight + 40);
  for (const p of confetti) {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    cctx.save();
    cctx.translate(p.x, p.y); cctx.rotate(p.rot);
    cctx.fillStyle = p.color;
    cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cctx.restore();
  }
}

/* ============================================================
   accessibility — keyboard, focus, ARIA, scene text
   ============================================================ */
const sceneDescEl = document.getElementById('scene-desc');
const doorListEl = document.getElementById('doorlist');
const walkStatusEl = document.getElementById('walkstatus');
for (const id of ['minimap', 'viewbar', 'jumpbar']) {
  const el = document.getElementById(id);
  if (el) document.body.insertBefore(el, app);
}
canvas.tabIndex = 0;
canvas.setAttribute('role', 'img');
canvas.setAttribute('aria-label', '3D street view. Arrow keys look round and walk; Home faces down the street again.');
canvas.setAttribute('aria-describedby', 'scene-desc');

function a11yMarkCurrentPart() {
  if (!currentStage) return;
  for (const b of jumpBtns) {
    if (Number(b.dataset.part) === currentStage.part) b.setAttribute('aria-current', 'true');
    else b.removeAttribute('aria-current');
  }
}
const spokenMask = mask => (mask === '?' ? 'no number yet' : mask.replace(/_+/g, ' blank ').replace(/\s+/g, ' ').trim());

/* the street in a sentence, then each side's numbers in walking order */
function a11yStageText() {
  const st = currentStage, ud = curUD();
  if (!st || !ud) return '';
  const L = ud.layout;
  const solved = new Set(); for (const b of ud.blankStates) if (b.solved) solved.add(b.value);
  const say = h => (h.mask !== null && !solved.has(h.value) ? `blank (${spokenMask(h.mask)})` : String(h.value));
  let text;
  if (L.kind === 'street') {
    const nb = st.blocks.length;
    text = `${st.label}: ${nb === 1 ? 'one block' : nb + ' blocks'} with ${st.blocks[0].n || st.blocks[0].left.length} houses a side` +
           (nb > 1 ? `, the ${st.blocks.map(b => b.hundred * 100).join(', ')} blocks, a cross street between each` : '') + '. ';
    for (const s of [-1, 1]) {
      const hs = L.houses.filter(h => h.side === s);
      text += `${s < 0 ? 'Left' : 'Right'} side from the start: ${hs.map(say).join(', ')}. `;
    }
  } else {
    text = `${st.label}, a court off ${st.main.name} with a bulb at the end. `;
    for (const key of ['left', 'right']) {
      const hs = L.houses.filter(h => h.courtSide === key);
      text += `${key === 'left' ? 'Left' : 'Right'} side going in, then round the bulb: ${hs.map(say).join(', ')}. `;
    }
  }
  if (st.kind === 'example') return text + 'This is a worked example — every house already shows its number.';
  const left = ud.blankStates.filter(b => !b.solved).length;
  if (left) return `${text}${left} house${left === 1 ? ' is' : 's are'} blank — use the house list to fill ${left === 1 ? 'it' : 'them'} in.`;
  return `${text}Every house is filled in.`;
}
function a11yDescribeStage() {
  if (!sceneDescEl) return;
  const text = a11yStageText();
  if (sceneDescEl.textContent !== text) sceneDescEl.textContent = text;
}
function a11yRebuildDoorList() {
  if (!doorListEl) return;
  doorListEl.innerHTML = '';
  const ud = curUD();
  if (!ud || !currentStage || currentStage.kind !== 'quiz') return;
  for (const b of ud.blankStates) {
    if (b.solved) continue;
    const h = b.house;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = `House showing ${h.mask.replace(/_/g, '▢')}, ${h.desc} — open its options`;
    btn.setAttribute('aria-label', `House showing ${spokenMask(h.mask)}, ${h.desc} — open its options`);
    btn.onclick = () => openQuiz(b);
    doorListEl.appendChild(btn);
  }
}
/* "Standing by 204 and 205, facing up the street" */
function a11yFacing() {
  const f = forwardXZ();
  const court = curUD() && curUD().layout.kind === 'court';
  if (Math.abs(f.x) >= Math.abs(f.z)) return f.x > 0 ? (court ? 'east along the main street' : 'up the street, numbers rising')
                                                   : (court ? 'west along the main street' : 'back toward the start');
  return f.z < 0 ? (court ? 'into the court' : 'the left side') : (court ? 'back to the main street' : 'the right side');
}
let walkStatusTimer = 0;
function a11yWalkStatus() {
  if (!walkStatusEl) return;
  const nd = curNode();
  if (!nd) return;
  const ud = curUD();
  const shown = h => { const b = ud && ud.blankStates.find(x => x.house === h); return (h.mask !== null && b && !b.solved) ? 'a blank house' : h.value; };
  const near = nd.near && nd.near.length ? `by ${nd.near.map(shown).join(' and ')}` : (nd.at ? `at ${nd.at}` : 'on the road');
  clearTimeout(walkStatusTimer);
  walkStatusTimer = setTimeout(() => { walkStatusEl.textContent = `Standing ${near}, facing ${a11yFacing()}.`; }, 250);
}

let a11yReturnFocus = null;
function a11yOnQuizOpen() {
  const prev = document.activeElement;
  if (prev && prev !== document.body && !ui.quiz.contains(prev)) a11yReturnFocus = prev;
  setTimeout(() => { const first = ui.qopts.querySelector('button.opt:not([disabled])'); if (first) first.focus(); }, 0);
}
function a11yOnQuizClose() {
  const back = a11yReturnFocus;
  a11yReturnFocus = null;
  setTimeout(() => { if (back && back.isConnected) back.focus(); else canvas.focus(); }, 0);
}

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const quizOpen = !!activeBlank && !ui.quiz.classList.contains('hidden');
  if (quizOpen) {
    if (e.key === 'Escape') { e.preventDefault(); closeQuiz(); return; }
    const opts = [...ui.qopts.querySelectorAll('button.opt:not([disabled])')];
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && opts.length) {
      e.preventDefault();
      const step = e.key === 'ArrowDown' ? 1 : -1;
      const at = opts.indexOf(document.activeElement);
      const to = at < 0 ? (step > 0 ? 0 : opts.length - 1) : (at + step + opts.length) % opts.length;
      opts[to].focus();
      return;
    }
    const k = e.key.toLowerCase();
    const idx = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
    if (idx >= 0) {
      const btn = [...ui.qopts.querySelectorAll('button.opt')][idx];
      if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
      return;
    }
    return;
  }
  if (e.key === 'Home') { e.preventDefault(); resetView(); return; }
  if (t && t !== document.body && t !== canvas && typeof t.closest === 'function' && t.closest('button, a[href], [tabindex]:not(canvas)')) return;
  switch (e.key.toLowerCase()) {
    case 'arrowleft': case 'a': e.preventDefault(); turnBy(20, 220); break;
    case 'arrowright': case 'd': e.preventDefault(); turnBy(-20, 220); break;
    case 'arrowup': case 'w': e.preventDefault(); walkAhead('key'); break;
    case 'arrowdown': case 's': e.preventDefault(); walkBack('key'); break;
    case 'pageup': e.preventDefault(); easeLook({ pitch: look.pitch + 0.18 }, 200); break;
    case 'pagedown': e.preventDefault(); easeLook({ pitch: look.pitch - 0.18 }, 200); break;
    default: return;
  }
  a11yWalkStatus();
});

let a11ySig = null, a11yQuizWasOpen = false;
function a11ySync() {
  const ud = curUD();
  const sig = currentIndex + '|' + (ud ? ud.blankStates.filter(b => b.solved).length + '/' + ud.blankStates.length : '-');
  if (sig !== a11ySig) {
    a11ySig = sig;
    a11yMarkCurrentPart();
    a11yDescribeStage();
    a11yRebuildDoorList();
  }
  const open = !!activeBlank && !ui.quiz.classList.contains('hidden');
  if (open !== a11yQuizWasOpen) {
    a11yQuizWasOpen = open;
    if (open) a11yOnQuizOpen(); else a11yOnQuizClose();
  }
}
for (const ev of ['stagechange', 'blanksolved', 'quizopen', 'quizclose']) document.addEventListener(ev, a11ySync);
setInterval(a11ySync, 200);

/* ============================================================
   loop + resize
   ============================================================ */
addEventListener('resize', () => {
  const wasDefault = Math.abs(look.fov - fovDefault()) < 0.5;
  camera.aspect = innerWidth / innerHeight;
  if (wasDefault) look.fov = fovDefault();
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  applyLook();
  sizeConfetti();
});
(function tick() {
  // glide after a flick, then settle
  if (!dragging && (Math.abs(look.vyaw) > 1e-4 || Math.abs(look.vpitch) > 1e-4)) {
    look.yaw += look.vyaw; look.pitch += look.vpitch;
    look.vyaw *= 0.9; look.vpitch *= 0.9;
    if (Math.abs(look.vyaw) <= 1e-4) look.vyaw = 0;
    if (Math.abs(look.vpitch) <= 1e-4) look.vpitch = 0;
    applyLook(); mmSync(); if (!look.vyaw && !look.vpitch) updateResetChip();
  }
  renderer.render(scene, camera);
  drawConfetti();
  requestAnimationFrame(tick);
})();

showStage(0);

/* console handle for checking the scene without a mouse:
   sfHouses.go(i) shows stage i, .walk(n) steps to viewpoint n, .face(deg) turns,
   .solve() answers every open house on the current street */
window.sfHouses = {
  stages: STAGES, go: showStage, walk: i => walkTo(i, 'console'), turn: turnBy, reset: resetView, look,
  face(yawDeg, pitchDeg = 0, fov) { look.yaw = THREE.MathUtils.degToRad(yawDeg); look.pitch = THREE.MathUtils.degToRad(pitchDeg); if (fov) look.fov = fov; applyLook(); mmSync(); },
  ud: curUD, open: k => { const ud = curUD(); const b = ud && ud.blankStates.filter(s => !s.solved)[k || 0]; if (b) openQuiz(b); return b ? b.value : null; },
  solve() { const ud = curUD(); if (!ud) return; for (const b of ud.blankStates) if (!b.solved) { openQuiz(b); const btn = [...ui.qopts.children][b.options.indexOf(b.value)]; btn.click(); } },
  node: () => curUD() && curUD().node,
};
</script>
</body>
