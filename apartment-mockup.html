<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Stop Finder — Apartment Number Course</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .hidden { display: none !important; }

  /* ---- accessibility (doc 07) ----------------------------------------
     Contrast verified against the panel background #14181e (WCAG relative
     luminance).  No colour changes were needed:
       amber   #ffd9a0 on panel ......... 13.3 : 1  AA/AAA
       grey    #9fb0c0 on panel (12 px) .  8.0 : 1  AA
       success #7ee0a0 on panel ......... 11.1 : 1  AA/AAA
       error   #ff9a8a on panel ..........  8.7 : 1  AA/AAA
       blank   #c0392b on the white plate   5.4 : 1  AA
       text    #08130c on green #57c97e ..  9.1 : 1  AA/AAA
       doc 09  #f28c6a / #7cc4ff on panel   7.6 / 9.8 : 1  AA
     -------------------------------------------------------------------- */
  .sr-only { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  button:focus-visible, canvas:focus-visible, [tabindex]:focus-visible { outline:3px solid #ffd54a; outline-offset:2px; box-shadow:0 0 0 6px rgba(20,24,30,.9); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    button.opt.wrong { animation:none !important; }
  }

  /* top prompt */
  #prompt {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    width: min(760px, calc(100% - 32px));
    background: rgba(20, 24, 30, 0.86); backdrop-filter: blur(6px);
    color: #eef2f6; border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px; padding: 16px 20px; line-height: 1.55; font-size: 15px;
    box-shadow: 0 10px 34px rgba(0,0,0,0.4); z-index: 10; text-align: center;
  }
  #prompt b { color: #ffd9a0; }

  /* buttons */
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 999px;
    padding: 13px 30px; font-size: 16px; font-weight: 600; color: #08130c;
    background: #57c97e; box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    transition: transform .1s ease, background .12s ease;
  }
  button:hover { transform: translateY(-2px); background: #6fe096; }
  button.ghost {
    background: rgba(255,255,255,0.10); color: #eef2f6;
    border: 1px solid rgba(255,255,255,0.20); font-weight: 500; padding: 11px 20px;
  }
  button.ghost:hover { background: rgba(255,255,255,0.18); }
  #viewbar button.vbtn.active { background: #57c97e; color: #08130c; border-color: transparent; }
  #resetview { position: fixed; right: 22px; bottom: 80px; z-index: 11; padding: 9px 14px; font-size: 14px; }

  /* bottom button bar */
  #bottombar {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; align-items: center; gap: 10px;
  }

  /* left-side "walk around" buttons (Part 5) */
  #viewbar {
    position: fixed; top: 50%; left: 22px; transform: translateY(-50%);
    z-index: 11; display: flex; flex-direction: column; gap: 8px; width: 130px;
    background: rgba(20,24,30,0.90); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 14px;
    padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  #viewbar .vbtitle { color: #9fb0c0; font-size: 12px; text-align: center; margin-bottom: 2px; }
  #viewbar button.vbtn { padding: 10px 14px; font-size: 15px; text-align: center; min-height: 44px; }

  /* top-left "jump to part" menu */
  #jumpbar {
    position: fixed; top: 16px; left: 16px; z-index: 11;
    background: rgba(20,24,30,0.90); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 14px;
    padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  #jumpbar .jbtitle { color: #9fb0c0; font-size: 12px; text-align: center; margin-bottom: 8px; }
  #jumpbar .jbtns { display: flex; gap: 8px; }
  #jumpbar button.jbtn {
    width: 40px; height: 40px; padding: 0; font-size: 15px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  #jumpbar button.jbtn.active { background: #57c97e; color: #08130c; border-color: transparent; }

  /* right-side quiz panel */
  #quiz {
    position: fixed; top: 50%; right: 22px; transform: translateY(-50%);
    width: 248px; z-index: 11;
    background: rgba(20,24,30,0.90); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 14px;
    padding: 38px 16px 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  #quiz .qhead { color: #eef2f6; font-weight: 600; margin-bottom: 12px; text-align: center; }
  #quiz .qhead small { display: block; color: #9fb0c0; font-weight: 400; font-size: 12px; margin-top: 3px; line-height: 1.4; }
  #qclose {
    position: absolute; top: 5px; right: 6px; width: 32px; height: 32px; padding: 0;
    border-radius: 50%; font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #qkey {
    display: flex; gap: 10px; justify-content: center; font-size: 11px;
    text-transform: uppercase; letter-spacing: .06em; color: #9fb0c0; margin: -6px 0 10px;
  }
  #qopts { display: flex; flex-direction: column; gap: 8px; }
  button.opt {
    background: rgba(255,255,255,0.08); color: #eef2f6;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 10px;
    display: flex; align-items: center; gap: 10px; min-height: 48px;
    padding: 10px 14px; font-size: 16px; font-weight: 600; text-align: left;
    line-height: 1.5; box-shadow: none;
    transition: background .12s, transform .12s, border-color .12s;
  }
  button.opt:hover { transform: none; }
  button.opt:hover:not(:disabled) {
    background: rgba(255,255,255,0.16); transform: translateX(3px);
    border-color: rgba(255,217,160,0.6);
  }
  button.opt .ltr { width: 22px; color: #9fb0c0; font-weight: 500; }
  button.opt .num {
    font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum"; letter-spacing: .02em;
  }
  .pl + .pl { margin-left: .14em; }              /* hairline gap between digit places */
  .pl-building { color: var(--c-building, #f28c6a); }
  .pl-floor    { color: var(--c-floor, #7cc4ff); }
  .pl-door     { color: var(--c-door, #eef2f6); }
  button.opt.wrong { background: rgba(229,57,53,0.32); border-color: rgba(229,57,53,0.75); animation: shake .42s; }
  button.opt.right { background: rgba(87,201,126,0.28); border-color: rgba(87,201,126,0.7); }
  button.opt:disabled { cursor: default; }
  #qmsg { margin-top: 12px; text-align: center; font-size: 14px; min-height: 20px; line-height: 1.4; }
  #qmsg.ok { color: #7ee0a0; }
  #qmsg.bad { color: #ff9a8a; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

  /* ============================================================
     RESPONSIVE / MOBILE LAYOUT (design 06)
     Overrides only — every rule below lives inside a media query so
     the base (desktop) rules owned by the other docs stay untouched.
     ============================================================ */

  /* --- coarse pointers anywhere: minimum tap targets --- */
  @media (pointer: coarse) {
    button { min-height: 44px; }
    #jumpbar button.jbtn { width: 44px; height: 44px; }
    button.opt { min-height: 52px; }
  }

  /* --- tablets 641-1024px: desktop layout holds, quiz just tucks in --- */
  @media (min-width: 641px) and (max-width: 1024px) {
    #quiz { right: 12px; width: 248px; }
    /* the centred prompt is full-bleed at this width, so drop the jump bar below it */
    #jumpbar { top: calc(var(--prompt-h, 140px) + 16px); }
  }

  /* --- phones, portrait --- */
  @media (max-width: 640px) {
    #prompt { top: 8px; left: 8px; right: 8px; width: auto; transform: none; padding: 10px 12px 11px;
      max-height: 34vh; overflow-y: auto; overscroll-behavior: contain; }
    #prompt .ptitle { font-size: 16px; }
    #prompt .pbody { font-size: 15px; }

    #jumpbar { top: calc(var(--prompt-h, 140px) + 16px); left: 8px; padding: 6px; }
    #jumpbar .jbtitle { display: none; }
    #jumpbar .jbtns { gap: 8px; }
    #jumpbar button.jbtn { width: 40px; height: 40px; }
    #progress { margin-top: 6px; }

    #doorsleft { top: calc(var(--prompt-h, 140px) + 16px); right: 8px; left: auto; }

    #bottombar { bottom: 12px; gap: 8px; width: calc(100% - 16px); justify-content: center; }
    #bottombar button { padding: 12px 18px; font-size: 15px; min-height: 46px; }

    #viewbar { top: auto; bottom: 70px; left: 8px; transform: none;
      flex-direction: row; width: auto; gap: 6px; padding: 8px; }
    #viewbar .vbtitle { display: none; }
    #viewbar button.vbtn { min-width: 60px; min-height: 44px; padding: 10px 6px; font-size: 14px; }

    #helpbtn   { right: 8px; bottom: 70px;  left: auto; }
    #resetview { right: 8px; bottom: 118px; left: auto; padding: 0; width: 40px; height: 40px; }
    #resetview .rv-label { display: none; }
    #minimap   { right: 8px; bottom: 166px; left: auto; top: auto; width: 88px; }
    #draghint  { left: 8px; right: 8px; width: auto; bottom: 130px; }

    #quiz { top: auto; bottom: 0; left: 0; right: 0; width: auto; transform: none; z-index: 30;
      border-radius: 16px 16px 0 0; border-bottom: none; max-height: 60vh; overflow-y: auto;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
    #qopts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.opt { min-height: 56px; display: flex; align-items: center; justify-content: center; }
    button.opt .ltr { display: none; }
    button.opt .num { font-size: 24px; }
    #qclose { width: 44px; height: 44px; top: 4px; right: 4px; }
    #finale { inset: 0; border-radius: 0; }
  }

  /* --- phones, landscape --- */
  @media (max-height: 520px) and (orientation: landscape) {
    #prompt { top: 8px; left: 8px; right: auto; transform: none; width: min(52vw, 460px);
      max-height: 44vh; overflow-y: auto; padding: 8px 12px; }
    #prompt .ptitle { font-size: 14px; }
    #prompt .pbody { font-size: 13px; }

    #jumpbar { top: auto; bottom: 8px; left: 8px; padding: 6px; }
    #jumpbar .jbtitle { display: none; }

    #bottombar { bottom: 8px; left: auto; right: 8px; transform: none; }
    #bottombar button { padding: 9px 16px; font-size: 14px; }

    #viewbar { top: auto; bottom: 8px; left: 232px; transform: none;
      flex-direction: row; width: auto; padding: 8px; gap: 6px; }
    #viewbar .vbtitle { display: none; }
    #viewbar button.vbtn { min-width: 56px; min-height: 44px; padding: 8px 6px; font-size: 13px; }

    #quiz { top: 8px; bottom: 8px; right: 8px; left: auto; width: 236px;
      max-height: none; transform: none; border-radius: 14px; overflow-y: auto; }
    #qopts { display: flex; flex-direction: column; }

    #minimap { right: 252px; top: 8px; bottom: auto; left: auto; width: 88px; }
    #doorsleft { top: 8px; right: 8px; }
    #helpbtn, #resetview { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<!-- screen-reader text for the 3D scene, and a keyboard route to every blank door -->
<p id="scene-desc" class="sr-only"></p>
<div id="doorlist" class="sr-only" role="group" aria-label="Doors to fill in"></div>

<div id="prompt" aria-live="polite" aria-atomic="true"></div>

<!-- right-side multiple-choice panel -->
<div id="quiz" class="hidden" role="dialog" aria-labelledby="qhead">
  <button id="qclose" class="ghost" aria-label="Close">×</button>
  <div class="qhead" id="qhead">Which unit is this?<small>Pick the number that matches the pattern</small></div>
  <div id="qkey" class="hidden"><span class="pl pl-building">building</span><span class="pl pl-floor">floor</span><span class="pl pl-door">door</span></div>
  <div id="qopts"></div>
  <div id="qmsg" aria-live="assertive" aria-atomic="true"></div>
</div>

<!-- Part 5 navigation: jump the camera to each face of the building -->
<div id="viewbar" class="hidden" role="group" aria-label="Walk around the building">
  <div class="vbtitle">Walk around</div>
  <button class="ghost vbtn" data-view="front">Front</button>
  <button class="ghost vbtn" data-view="back">Back</button>
  <button class="ghost vbtn" data-view="left">Left</button>
  <button class="ghost vbtn" data-view="right">Right</button>
</div>

<!-- jump menu: skip to the first building of any part -->
<div id="jumpbar" role="navigation" aria-label="Jump to part">
  <div class="jbtitle">Jump to part</div>
  <div class="jbtns">
    <button class="ghost jbtn" data-part="1" aria-label="Part 1: numbers count up in order">1</button>
    <button class="ghost jbtn" data-part="2" aria-label="Part 2: first digit is the floor">2</button>
    <button class="ghost jbtn" data-part="3" aria-label="Part 3: leading digits name the building">3</button>
    <button class="ghost jbtn" data-part="4" aria-label="Part 4: numbers wrap front and back">4</button>
    <button class="ghost jbtn" data-part="5" aria-label="Part 5: one running count, no floor digit">5</button>
  </div>
</div>

<div id="bottombar" role="group" aria-label="Course navigation">
  <button id="back" class="ghost hidden">◀ Back</button>
  <button id="continue" class="hidden">Continue ▸</button>
  <button id="next" class="hidden">Next Building ▸</button>
</div>

<button id="resetview" class="ghost hidden" aria-label="Reset the camera to the default view">↺ <span class="rv-label">Reset view</span></button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   CONFIG — 2-story garden 4-plex. Units run sequentially around
   each building: front F1 (L,R), F2 (L,R), then back F1, F2.
   Each "building" in the course shows one façade of 4 units:
   Bld 1 = example 101-108, Bld 2 = 109-112, Bld 3 = 113-116,
   Bld 4 = 117-120 (continuing the same numbering).
   ============================================================ */
const CONFIG = {
  floors: 2, width: 14, depth: 9, floorHeight: 3.2,
  doorOffsetX: 1.45, windowOffsetX: 4.6, gap: 10,
};

const COLOR = {
  ground: 0x86996a, walkway: 0xbdb8ad, road: 0x7d8792,
  brick: 0xc7b29a, siding: 0xb0493a, band: 0xe7dcc4,
  roof: 0x4a3b30, canopy: 0xe9ddc4,
  door: 0x5b9d66, glass: 0x46586e, trim: 0xe9ddc4,
  balcony: 0xcfc7b6, step: 0xcfc7b6, sky: 0xbfd9ec,
  arrow: 0xffd54a,
};

const W = CONFIG.width, D = CONFIG.depth, FH = CONFIG.floorHeight;
const H = CONFIG.floors * FH, HALF_D = D / 2, SPAN = W + CONFIG.gap;

/* ---- Part 2: tall 4-story walk-up (3 doors per floor). Same depth as the
   plex so the shared ground/road still fit; only wider. Units are 3 digits
   where the FIRST digit is the floor and the last two digits are the column. */
const TW = 18, TD = 9, TFLOORS = 4, TFH = 3.2;
const TH = TFLOORS * TFH, THALF_D = TD / 2;   // 12.8 tall, 4.5 half-depth
const TDOORX = [-5.5, 0, 5.5];                 // left / middle / right doors

/* ---- Part 3: wide 2-story "garden row" with 5 doors per floor. Units are
   4- or 5-digit; the LEADING digit(s) are the building number, then the floor,
   then the door. Learners fill the gaps, then name the building. */
const RW = 24, RD = 9, RFLOORS = 2, RFH = 3.2;
const RH = RFLOORS * RFH, RHALF_D = RD / 2;
const RDOORX = [-9.6, -4.8, 0, 4.8, 9.6];

/* ---- Part 4: 4-story block numbered around BOTH faces (front doors + the
   doors directly behind them). 5-digit units: building*1000 + floor*100 +
   suffix, where the front gets odd suffixes and the back gets even. */
const BW = 16, BD = 10, BFLOORS = 4, BFH = 3.2;
const BH = BFLOORS * BFH, BHALF_D = BD / 2;
const BDOORX = 3.6;                            // door offset from centre

/* ---- Part 5: a uniform 3-story walk-up in the same solid-slab style as
   Parts 3-4. The unit number is a single running count with NO floor digit,
   so floor 1 owns both the lowest numbers AND the highest. Doors sit around
   the perimeter facing OUT, so each side's doors read straight-on from its
   nav button. Floor 1 is fully occupied (left 1-4, back 5-6, front 7-8,
   right 17-20); floors 2-3 have only front/back pairs, on walkways served
   by a switchback stair at two opposite corners. ---- */
const SQW = 12, SQHW = SQW / 2;          // width  (X, left <-> right)
const SQD = 22, SQHD = SQD / 2;          // depth  (Z, front <-> back)
const SQFH = 3.2, SQFLOORS = 3, SQH = SQFLOORS * SQFH;

/* door slots: { d:door#, f:floorIndex 0-2, face:'L'|'R'|'F'|'B', a:position
   along that wall (z for L/R, x for F/B) }. Left counts up toward the back;
   right counts up from the back to the front. */
const SQ_LAYOUT = [
  // floor 1 left wall (front -> back) = 1..4
  { d: 1, f: 0, face: 'L', a:  7.5 }, { d: 2, f: 0, face: 'L', a:  2.5 },
  { d: 3, f: 0, face: 'L', a: -2.5 }, { d: 4, f: 0, face: 'L', a: -7.5 },
  // floor 1 back wall 5,6 ; front wall 7,8
  { d: 5, f: 0, face: 'B', a: -3 }, { d: 6, f: 0, face: 'B', a: 3 },
  { d: 7, f: 0, face: 'F', a: -3 }, { d: 8, f: 0, face: 'F', a: 3 },
  // floor 2 back 9,10 ; front 11,12
  { d: 9, f: 1, face: 'B', a: -3 }, { d: 10, f: 1, face: 'B', a: 3 },
  { d: 11, f: 1, face: 'F', a: -3 }, { d: 12, f: 1, face: 'F', a: 3 },
  // floor 3 back 13,14 ; front 15,16
  { d: 13, f: 2, face: 'B', a: -3 }, { d: 14, f: 2, face: 'B', a: 3 },
  { d: 15, f: 2, face: 'F', a: -3 }, { d: 16, f: 2, face: 'F', a: 3 },
  // floor 1 right wall (back -> front) = 17..20
  { d: 17, f: 0, face: 'R', a: -7.5 }, { d: 18, f: 0, face: 'R', a: -2.5 },
  { d: 19, f: 0, face: 'R', a:  2.5 }, { d: 20, f: 0, face: 'R', a:  7.5 },
];

/* ============================================================ */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(COLOR.sky);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 3000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
/* no tone mapping on purpose: it would shift plate colours (MeshBasicMaterial is tone-mapped too) */
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;                       // panning is how buildings get lost
controls.minPolarAngle = 0.18;                    // no straight-down "map" view
controls.maxPolarAngle = Math.PI * 0.49;          // never under the ground
controls.minDistance = 8;
controls.maxDistance = 95;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_ROTATE };

const hemi = new THREE.HemisphereLight(0xfff5e6, 0x7a7466, 0.6);   // warm sky, warm-grey bounce
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 1.45);   // tuned so a sunlit brick wall matches the old render within +-6 %
sun.position.set(18, 30, 26);          // front-right, high: shadows fall down-left, doors read as recessed
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 120;
sun.shadow.camera.left = -34; sun.shadow.camera.right = 34;
sun.shadow.camera.top = 34;   sun.shadow.camera.bottom = -34;   // buildings are centred on origin; +-34 covers the 24-wide row + stairs
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
scene.add(new THREE.AmbientLight(0xffffff, 0.18));

/* ---- sky dome (vertex-coloured inverted sphere) + distance fog ---- */
const skyGeo = new THREE.SphereGeometry(900, 32, 16);
{
  const col = [], top = new THREE.Color(0x6fa3d6), hor = new THREE.Color(0xdfe9ef), c = new THREE.Color();
  const pos = skyGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const t = THREE.MathUtils.clamp(pos.getY(i) / 900, 0, 1);     // 0 at/below horizon, 1 overhead
    c.copy(hor).lerp(top, Math.pow(t, 0.6)); col.push(c.r, c.g, c.b);
  }
  skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
}
const sky = new THREE.Mesh(skyGeo,
  new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false }));
scene.add(sky);
scene.background = null;
scene.fog = new THREE.Fog(0xdfe9ef, 140, 420);   // fades the enlarged ground into the horizon; plates (<45 units) untouched

/* ---- helpers ---- */
/* per-role roughness so surfaces don't all read as the same plastic */
const ROUGH = new Map([[COLOR.brick, .88], [COLOR.siding, .86], [COLOR.door, .95], [COLOR.roof, .72],
                       [COLOR.step, .9], [COLOR.balcony, .9], [COLOR.walkway, .95], [COLOR.canopy, .9]]);
function box(parent, w, h, d, color, x, y, z, opts = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: ROUGH.get(color) ?? 0.92, ...opts }));
  m.castShadow = true; m.receiveShadow = true;
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
/* ---- plate / sign typography ----
   One font stack for every number in the scene, numerals that fill their
   plate, and a blank style that reads without colour (dashed frame + hollow
   boxes where digits are missing). */
const PLATE_FONT = '"Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif';
const PLATE_FG = '#16202b', PLATE_BG = 'rgba(255,255,255,0.96)';
const BLANK_FG = '#c0392b';                 // 5.4:1 on the white plate
const BLANK_ON_DARK = '#ffd9a0';            // same cue on the dark banner
const BLANK_DASH = { width: 14, dash: [40, 26], inset: 22 };   // in 1024-px canvas units

/* is this CSS colour dark? accepts #rgb, #rrggbb, rgb() and rgba() */
function isDarkBg(css) {
  if (!css) return false;
  let r = 255, g = 255, b = 255;
  const m = /rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)/.exec(css);
  if (m) { r = +m[1]; g = +m[2]; b = +m[3]; }
  else if (css[0] === '#') {
    const hx = css.slice(1), t = hx.length === 3 ? hx.replace(/./g, c => c + c) : hx;
    r = parseInt(t.slice(0, 2), 16); g = parseInt(t.slice(2, 4), 16); b = parseInt(t.slice(4, 6), 16);
  }
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 < 0.5;
}

/* a hollow rounded box standing in for one missing digit, baseline-aligned */
function drawDigitBox(ctx, x, baselineY, adv, cap, color) {
  const bw = adv * 0.84, bh = cap * 0.78, r = Math.min(bw, bh) * 0.18;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(2, cap * 0.09);
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x + (adv - bw) / 2, baselineY - bh, bw, bh, r);
  else ctx.rect(x + (adv - bw) / 2, baselineY - bh, bw, bh);
  ctx.stroke();
  ctx.restore();
}

function makeTextTexture(text, opts = {}) {
  const s = String(text);
  const isBlank = /[?_]/.test(s);
  const wide = s.length > 3;                                  // 4-5 digit units get more pixels
  const { w = wide ? 768 : 512, h = wide ? 384 : 256,
    bg = PLATE_BG, fg = PLATE_FG, font = 'bold 170px sans-serif' } = opts;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h); }

  /* keep the caller's weight and size, always force our own family */
  const fm = /^\s*(.*?)(\d+(?:\.\d+)?)px\s/.exec(font);
  const weight = fm ? fm[1].trim() : 'bold';
  const base = fm ? parseFloat(fm[2]) : 170;
  const fontAt = px => `${weight} ${px}px ${PLATE_FONT}`.trim();

  /* the dashed blank frame, and the room it leaves for the text */
  const k = w / 1024, dashLw = BLANK_DASH.width * k, dashInset = BLANK_DASH.inset * k + dashLw / 2;
  const pad = isBlank ? dashInset + dashLw : 0;
  const availW = w - 2 * pad, availH = h - 2 * pad;

  /* fit to the plate: <= 86 % of the width, cap height <= 72 % of the height,
     never more than 1.35x the size the caller asked for (scaled with the
     canvas, so a 768x384 plate is not left with small numerals) */
  const probe = s.replace(/_/g, '0');                         // a box takes a digit's room
  ctx.font = fontAt(100);
  const pm = ctx.measureText(probe);
  const wPer = (pm.width || 50) / 100;
  const ascPer = (pm.actualBoundingBoxAscent || 72) / 100;
  const descPer = (pm.actualBoundingBoxDescent || 0) / 100;
  const px = Math.max(8, Math.min(0.86 * availW / wPer, 0.72 * availH / ascPer,
    0.88 * availH / (ascPer + descPer), 1.35 * base * (h / 256)));
  ctx.font = fontAt(px);
  const dm = ctx.measureText('0');
  const cap = dm.actualBoundingBoxAscent || px * 0.72;         // digit cap height
  const asc = ascPer * px, desc = descPer * px;
  const baselineY = (h - (asc + desc)) / 2 + asc;              // centre the ink, not the em
  const blankFg = isDarkBg(bg) ? BLANK_ON_DARK : BLANK_FG;

  if (isBlank) {                                              // dashed frame = still missing
    ctx.save();
    ctx.strokeStyle = blankFg; ctx.lineWidth = dashLw;
    ctx.setLineDash(BLANK_DASH.dash.map(d => d * k));
    ctx.strokeRect(dashInset, dashInset, w - 2 * dashInset, h - 2 * dashInset);
    ctx.restore();
  }

  ctx.textBaseline = 'alphabetic';
  if (isBlank) {                                              // glyph by glyph: '_' -> box
    ctx.textAlign = 'left';
    const adv = ch => ctx.measureText(ch === '_' ? '0' : ch).width;
    const chars = Array.from(s);
    let x = (w - chars.reduce((t, ch) => t + adv(ch), 0)) / 2;
    for (const ch of chars) {
      const a = adv(ch);
      if (ch === '_') drawDigitBox(ctx, x, baselineY, a, cap, blankFg);
      else { ctx.fillStyle = ch === '?' ? blankFg : fg; ctx.fillText(ch, x, baselineY); }
      x += a;
    }
  } else {
    ctx.textAlign = 'center'; ctx.fillStyle = fg;
    ctx.fillText(s, w / 2, baselineY);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}
function label(parent, text, pw, ph, texOpts = {}) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph),
    new THREE.MeshBasicMaterial({ map: makeTextTexture(text, texOpts), transparent: true }));
  parent.add(m); return m;
}
function setPlateText(plate, text, texOpts = {}) {
  plate.material.map.dispose();
  plate.material.map = makeTextTexture(text, texOpts);
  plate.material.color.set('#ffffff');   // drop any hover tint on solve
  plate.material.needsUpdate = true;
}

/* ---- a bright, readable 3D arrow from -> to ---- */
function arrow(parent, from, to, color) {
  const dir = to.clone().sub(from);
  const len = dir.length();
  const shaftLen = Math.max(0.05, len - 0.6);
  const grp = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color });
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, shaftLen, 12), mat);
  shaft.position.y = shaftLen / 2;
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.6, 16), mat);
  head.position.y = shaftLen + 0.3;
  grp.add(shaft, head);
  grp.position.copy(from);
  grp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  parent.add(grp);
}

/* ============================================================
   façade pieces shared by every building
   ============================================================ */
function addWindows(g, fi, s) {
  const base = fi * FH, surf = s * (HALF_D + 0.05);
  for (const wx of [-CONFIG.windowOffsetX, CONFIG.windowOffsetX]) {
    box(g, 2.0, 1.7, 0.05, COLOR.trim, wx, base + 1.65, surf);
    box(g, 1.65, 1.4, 0.06, COLOR.glass, wx, base + 1.65, s * (HALF_D + 0.07), { roughness: 0.3, metalness: 0.1 });
  }
}
function addFacadeCommon(g, s) {
  // open 2nd-floor landing (no fence)
  box(g, 6.6, 0.16, 1.5, COLOR.balcony, 0, FH - 0.06, s * (HALF_D + 0.75));
  // central staircase, no handrail
  const z = s * (HALF_D + 1.0), x0 = 3.0, x1 = -0.4, y0 = 0.12, y1 = FH - 0.05;
  for (let i = 0; i < 12; i++) {
    const t = i / 11;
    box(g, 0.7, 0.12, 1.25, COLOR.step, THREE.MathUtils.lerp(x0, x1, t) * s, THREE.MathUtils.lerp(y0, y1, t), z);
  }
  box(g, 7, 0.4, 1.7, COLOR.canopy, 0, H - 0.05, s * (HALF_D + 0.9));   // eyebrow canopy
}

/* one façade. getUnit(faceOrder, floor, side) -> {type:'num'|'blank'|'none', value} */
function buildFacade(g, s, isFront, getUnit, raycastList, blankStates) {
  const surf = s * (HALF_D + 0.05), plateZ = s * (HALF_D + 0.09);
  const yaw = s > 0 ? 0 : Math.PI, faceOrder = isFront ? 0 : 1;
  const leftX = isFront ? -CONFIG.doorOffsetX : CONFIG.doorOffsetX;
  const rightX = isFront ? CONFIG.doorOffsetX : -CONFIG.doorOffsetX;

  for (let fi = 0; fi < CONFIG.floors; fi++) {
    const base = fi * FH;
    for (const sd of [{ x: leftX, i: 0 }, { x: rightX, i: 1 }]) {
      const u = getUnit(faceOrder, fi, sd.i);
      const door = box(g, 1.25, 2.05, 0.14, COLOR.door, sd.x, base + 1.05, surf);
      if (!u || u.type === 'none') continue;

      if (u.type === 'num') {
        const plate = label(g, String(u.value), 1.7, 0.85);
        plate.position.set(sd.x, base + 2.5, plateZ);
        plate.rotation.y = yaw;
      } else { // blank — clickable
        const plate = label(g, '?', 1.7, 0.85, { fg: '#c0392b' });
        plate.position.set(sd.x, base + 2.5, plateZ);
        plate.rotation.y = yaw;
        const bstate = { value: u.value, solved: false, plate, options: makeOptions(u.value) };
        plate.userData.bstate = bstate;
        door.userData.bstate = bstate;
        raycastList.push(plate, door);
        blankStates.push(bstate);
      }
    }
    addWindows(g, fi, s);
  }
  addFacadeCommon(g, s);
}

/* ============================================================
   building shell (walls, roof, sidewalk, side number signs)
   ============================================================ */
function buildShell(g, number) {
  box(g, W, FH, D, COLOR.brick, 0, FH / 2, 0);
  box(g, W, FH, D, COLOR.siding, 0, FH + FH / 2, 0);
  box(g, W + 0.15, 0.18, D + 0.15, COLOR.band, 0, FH, 0);
  box(g, W + 1.4, 0.4, D + 1.4, COLOR.roof, 0, H + 0.2, 0);

  const sw = 2.2, sy = -0.14, st = 0.05;
  for (const s of [1, -1]) box(g, W + 2 * sw, st, sw, COLOR.walkway, 0, sy, s * (HALF_D + sw / 2));
  for (const ex of [1, -1]) box(g, sw, st, D + 2 * sw, COLOR.walkway, ex * (W / 2 + sw / 2), sy, 0);

  for (const ex of [1, -1]) {
    const sign = label(g, String(number), 2.4, 2.4, { bg: 'rgba(20,24,30,0.92)', fg: '#ffe4c2', font: 'bold 320px sans-serif', w: 512, h: 512 });
    sign.position.set(ex * (W / 2 + 0.06), H * 0.6, 0);
    sign.rotation.y = ex > 0 ? -Math.PI / 2 : Math.PI / 2;
  }
}

/* arrows tracing the counting order on the example front façade:
   bottom-left -> bottom-right -> up to top-left -> top-right */
function addArrows(g) {
  // pushed forward to sit right at the front edge of the central staircase
  const z = HALF_D + 1.55, yb = 2.0, yt = 5.25, xl = -CONFIG.doorOffsetX, xr = CONFIG.doorOffsetX;
  arrow(g, new THREE.Vector3(xl, yb, z), new THREE.Vector3(xr, yb, z), COLOR.arrow); // 1st -> 2nd
  arrow(g, new THREE.Vector3(xr, yb, z), new THREE.Vector3(xl, yt, z), COLOR.arrow); // wrap up
  arrow(g, new THREE.Vector3(xl, yt, z), new THREE.Vector3(xr, yt, z), COLOR.arrow); // 3rd -> 4th
}

/* ============================================================
   PART 2 — 4-story building. First digit = floor.
   ============================================================ */

/* options are the SAME unit on every floor (e.g. 129/229/329/429) so the
   learner must read the first digit to pick the right floor. */
function makeTowerOptions(correct) {
  const suffix = correct % 100;
  return shuffle([1, 2, 3, 4].map(f => f * 100 + suffix));
}

function buildTowerShell(g, txt) {
  for (let fi = 0; fi < TFLOORS; fi++) {
    box(g, TW, TFH, TD, fi % 2 ? COLOR.siding : COLOR.brick, 0, fi * TFH + TFH / 2, 0);
    box(g, TW + 0.15, 0.16, TD + 0.15, COLOR.band, 0, (fi + 1) * TFH, 0);
  }
  box(g, TW + 1.4, 0.4, TD + 1.4, COLOR.roof, 0, TH + 0.2, 0);

  const sw = 2.2, sy = -0.14, st = 0.05;
  for (const s of [1, -1]) box(g, TW + 2 * sw, st, sw, COLOR.walkway, 0, sy, s * (THALF_D + sw / 2));
  for (const ex of [1, -1]) box(g, sw, st, TD + 2 * sw, COLOR.walkway, ex * (TW / 2 + sw / 2), sy, 0);

  // building identifier — a LETTER, so it can't be mistaken for the floor digit
  for (const ex of [1, -1]) {
    const sign = label(g, txt, 2.6, 2.6, { bg: 'rgba(20,24,30,0.92)', fg: '#ffe4c2', font: 'bold 300px sans-serif', w: 512, h: 512 });
    sign.position.set(ex * (TW / 2 + 0.06), TH * 0.62, 0);
    sign.rotation.y = ex > 0 ? -Math.PI / 2 : Math.PI / 2;
  }
}

/* exterior walkways on floors 2-4, a ground stoop, and a switchback stair */
function buildTowerAccess(g) {
  const wDepth = 1.7, wzc = THALF_D + 0.85;
  for (let fi = 1; fi < TFLOORS; fi++) {
    box(g, TW, 0.16, wDepth, COLOR.balcony, 0, fi * TFH - 0.06, wzc);
    for (const px of [-TW / 2 + 0.6, -3, 3, TW / 2 - 0.6])
      box(g, 0.18, fi * TFH, 0.18, COLOR.trim, px, (fi * TFH) / 2, wzc + wDepth / 2 - 0.2);
  }
  box(g, TW, 0.12, wDepth, COLOR.step, 0, 0.0, wzc); // ground stoop

  const flight = (x, z0, z1, y0, y1, n = 6) => {
    const dz = (z1 - z0) / n;
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n;
      box(g, 1.4, 0.12, Math.abs(dz) + 0.02, COLOR.step, x, y0 + (y1 - y0) * t, z0 + dz * (i + 0.5));
    }
  };
  const landing = (yc, zc) => box(g, 3.0, 0.14, 1.4, COLOR.balcony, 10.8, yc - 0.07, zc);

  const zF = THALF_D + 0.9, zB = -1.6, xA = 10.0, xB = 11.6;
  for (let t = 0; t < TFLOORS - 1; t++) {
    const yFloor = t * TFH, yMid = t * TFH + TFH / 2, yNext = (t + 1) * TFH;
    landing(yFloor, zF);
    flight(xA, zF - 0.7, zB + 0.7, yFloor, yMid);
    landing(yMid, zB);
    flight(xB, zB + 0.7, zF - 0.7, yMid, yNext);
  }
  landing((TFLOORS - 1) * TFH, zF);
}

/* big up-arrow + floor badges on the left: shows the first digit climbing 1->4 */
function addTowerArrows(g) { 
  const x = -TW / 2 - 0.9, z = THALF_D + 1.6; 
  
  // 1. Create a specific X coordinate for the arrow (subtract more to move it left)
  const arrowX = x - 2; 
  
  // 2. Use 'arrowX' instead of 'x' here
  arrow(g, new THREE.Vector3(arrowX, 1.6, z), new THREE.Vector3(arrowX, TH - 0.9, z), COLOR.arrow); 
  
  // The labels will stay in their original position because they still use 'x'
  for (let fi = 0; fi < TFLOORS; fi++) { 
    const b = label(g, String(fi + 1), 1.0, 1.0, { bg: 'rgba(20,24,30,0.85)', fg: '#ffd54a', font: 'bold 240px sans-serif' }); 
    b.position.set(x, fi * TFH + 2.55, z + 0.02); 
  } 
}


/* one front façade: 4 floors x 3 doors. getUnit(floor, col) -> {type,value} */
function buildTowerFacade(g, getUnit, raycastList, blankStates) {
  const surf = THALF_D + 0.05, plateZ = THALF_D + 0.10;
  for (let fi = 0; fi < TFLOORS; fi++) {
    const base = fi * TFH;
    TDOORX.forEach((dx, ii) => {
      const u = getUnit(fi, ii);
      const door = box(g, 1.3, 2.05, 0.14, COLOR.door, dx, base + 1.05, surf);
      if (!u || u.type === 'none') return;
      if (u.type === 'num') {
        const plate = label(g, String(u.value), 1.8, 0.9);
        plate.position.set(dx, base + 2.55, plateZ);
      } else {
        const plate = label(g, '?', 1.8, 0.9, { fg: '#c0392b' });
        plate.position.set(dx, base + 2.55, plateZ);
        const bstate = { value: u.value, solved: false, plate, options: makeTowerOptions(u.value) };
        plate.userData.bstate = bstate;
        door.userData.bstate = bstate;
        raycastList.push(plate, door);
        blankStates.push(bstate);
      }
    });
    for (const wx of [-7.6, -2.75, 2.75, 7.6]) {
      box(g, 1.3, 1.5, 0.05, COLOR.trim, wx, base + 1.5, surf);
      box(g, 1.05, 1.25, 0.06, COLOR.glass, wx, base + 1.5, surf + 0.03, { roughness: 0.3, metalness: 0.1 });
    }
  }
}

/* ============================================================
   PART 3 — wide 2-story row. Leading digit(s) = building number.
   ============================================================ */

/* a plain stacked-floor slab (walls, bands, roof, sidewalks) shared by
   Parts 3 and 4 */
function buildSlabShell(g, w, d, floors, fh) {
  const h = floors * fh, halfD = d / 2;
  for (let fi = 0; fi < floors; fi++) {
    box(g, w, fh, d, fi % 2 ? COLOR.siding : COLOR.brick, 0, fi * fh + fh / 2, 0);
    box(g, w + 0.15, 0.16, d + 0.15, COLOR.band, 0, (fi + 1) * fh, 0);
  }
  box(g, w + 1.4, 0.4, d + 1.4, COLOR.roof, 0, h + 0.2, 0);
  const sw = 2.2, sy = -0.14, st = 0.05;
  for (const s of [1, -1]) box(g, w + 2 * sw, st, sw, COLOR.walkway, 0, sy, s * (halfD + sw / 2));
  for (const ex of [1, -1]) box(g, sw, st, d + 2 * sw, COLOR.walkway, ex * (w / 2 + sw / 2), sy, 0);
}

/* a wide banner across the top of the front. Also the plate the learner
   updates when they name the building. Returns the plate. */
function addTopBanner(g, h, halfD, text) {
  const plate = label(g, text, 9.6, 2.0, BANNER_OPTS);
  plate.position.set(0, h + 1.9, halfD + 0.12);
  for (const ex of [1, -1])                    // posts: the sign stands on the roof slab
    box(g, 0.16, 0.9, 0.16, COLOR.roof, ex * 4.2, h + 0.45, halfD + 0.05);
  return plate;
}
const BANNER_OPTS = { bg: 'rgba(20,24,30,0.92)', fg: '#ffe4c2', font: 'bold 150px sans-serif', w: 1024, h: 214 };

/* one front façade: RFLOORS x 5 doors. Each cell is either a number (shown)
   or a [value, mask] pair (blank — mask is the partial string, e.g. '710_'). */
function buildRowFacade(g, floorsData, raycastList, blankStates) {
  const surf = RHALF_D + 0.05, plateZ = RHALF_D + 0.10;
  for (let fi = 0; fi < RFLOORS; fi++) {
    const base = fi * RFH;
    RDOORX.forEach((dx, di) => {
      const cell = floorsData[fi][di];
      const isBlank = Array.isArray(cell);
      const value = isBlank ? cell[0] : cell;
      const door = box(g, 1.25, 2.05, 0.14, COLOR.door, dx, base + 1.05, surf);
      if (!isBlank) {
        const plate = label(g, String(value), 1.95, 0.92);
        plate.position.set(dx, base + 2.55, plateZ);
      } else {
        const plate = label(g, cell[1], 1.95, 0.92, { fg: '#c0392b' });
        plate.position.set(dx, base + 2.55, plateZ);
        const bstate = { value, solved: false, plate, options: makeBigOptions(value) };
        plate.userData.bstate = bstate;
        door.userData.bstate = bstate;
        raycastList.push(plate, door);
        blankStates.push(bstate);
      }
    });
    for (const wx of [-7.2, -2.4, 2.4, 7.2]) {
      box(g, 1.2, 1.4, 0.05, COLOR.trim, wx, base + 1.55, surf);
      box(g, 1.0, 1.15, 0.06, COLOR.glass, wx, base + 1.55, surf + 0.03, { roughness: 0.3, metalness: 0.1 });
    }
  }
  // open 2nd-floor landing + a straight stair clear of the doors at the right end
  box(g, RW, 0.16, 1.5, COLOR.balcony, 0, RFH - 0.06, RHALF_D + 0.78);
  const z = RHALF_D + 1.05;
  for (let i = 0; i < 11; i++) {
    const t = i / 10;
    box(g, 0.8, 0.12, 1.25, COLOR.step,
      THREE.MathUtils.lerp(12.4, 10.6, t),
      THREE.MathUtils.lerp(0.12, RFH - 0.05, t), z);
  }
}

/* ============================================================
   PART 4 — 4-story block numbered around the front AND back.
   ============================================================ */

/* unit = building*1000 + floor*100 + suffix.
   front: door0 -> 2f-1, door1 -> 2f+7   (odd suffixes)
   back:  door0 -> 2f+8, door1 -> 2f     (even suffixes, swapped L<->R) */
function blockUnit(building, isFront, fi, di) {
  const f = fi + 1;
  const suffix = isFront ? (di === 0 ? 2 * f - 1 : 2 * f + 7)
                         : (di === 0 ? 2 * f + 8 : 2 * f);
  return building * 1000 + f * 100 + suffix;
}

/* one façade (front s=1 / back s=-1), 4 floors x 2 doors.
   getCell(fi, di) -> { value, mask|null } */
function buildBlockFacade(g, s, isFront, getCell, raycastList, blankStates) {
  const surf = s * (BHALF_D + 0.05), plateZ = s * (BHALF_D + 0.10);
  const yaw = s > 0 ? 0 : Math.PI;
  const leftX = isFront ? -BDOORX : BDOORX;
  const rightX = isFront ? BDOORX : -BDOORX;
  for (let fi = 0; fi < BFLOORS; fi++) {
    const base = fi * BFH;
    for (const sd of [{ x: leftX, di: 0 }, { x: rightX, di: 1 }]) {
      const cell = getCell(fi, sd.di);
      const door = box(g, 1.3, 2.05, 0.14, COLOR.door, sd.x, base + 1.05, surf);
      if (cell.mask === null) {
        const plate = label(g, String(cell.value), 2.05, 0.95);
        plate.position.set(sd.x, base + 2.55, plateZ);
        plate.rotation.y = yaw;
      } else {
        const plate = label(g, cell.mask, 2.05, 0.95, { fg: '#c0392b' });
        plate.position.set(sd.x, base + 2.55, plateZ);
        plate.rotation.y = yaw;
        const bstate = { value: cell.value, solved: false, plate, options: makeBigOptions(cell.value) };
        plate.userData.bstate = bstate;
        door.userData.bstate = bstate;
        raycastList.push(plate, door);
        blankStates.push(bstate);
      }
    }
    for (const wx of [-6.6, 6.6]) {
      box(g, 1.3, 1.5, 0.05, COLOR.trim, wx, base + 1.55, surf);
      box(g, 1.05, 1.25, 0.06, COLOR.glass, wx, base + 1.55, surf + s * 0.03, { roughness: 0.3, metalness: 0.1 });
    }
    if (fi > 0) box(g, BW, 0.16, 1.5, COLOR.balcony, 0, base - 0.06, s * (BHALF_D + 0.8));
  }
}

/* switchback stair on the right end serving the upper landings */
function buildBlockAccess(g) {
  const flight = (x, z0, z1, y0, y1, n = 6) => {
    const dz = (z1 - z0) / n;
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n;
      box(g, 1.3, 0.12, Math.abs(dz) + 0.02, COLOR.step, x, y0 + (y1 - y0) * t, z0 + dz * (i + 0.5));
    }
  };
  const landing = (x, yc, zc) => box(g, 2.6, 0.14, 1.4, COLOR.balcony, x, yc - 0.07, zc);
  const zF = BHALF_D + 0.9, zB = -1.4, xA = BW / 2 + 0.2, xB = BW / 2 + 1.6;
  for (let t = 0; t < BFLOORS - 1; t++) {
    const yFloor = t * BFH, yMid = t * BFH + BFH / 2, yNext = (t + 1) * BFH;
    landing(xA, yFloor, zF);
    flight(xA, zF - 0.7, zB + 0.7, yFloor, yMid);
    landing(xB, yMid, zB);
    flight(xB, zB + 0.7, zF - 0.7, yMid, yNext);
  }
  landing(xA, (BFLOORS - 1) * BFH, zF);
}

/* the building label on both ends so it reads from the front or the back */
function addBlockSideSigns(g, text) {
  for (const ex of [1, -1]) {
    const sign = label(g, text, 4.2, 1.05,
      { bg: 'rgba(20,24,30,0.92)', fg: '#ffe4c2', font: 'bold 120px sans-serif', w: 1024, h: 256 });
    sign.position.set(ex * (BW / 2 + 0.06), BH * 0.62, 0);
    sign.rotation.y = ex > 0 ? -Math.PI / 2 : Math.PI / 2;
  }
}

/* ============================================================
   PART 5 — running count with NO floor digit, on a solid walk-up block.
   ============================================================ */

/* switchback stair hugging one corner (front-right s=1, back-left s=-1),
   serving the upper front/back walkways while staying clear of the
   side-wall doors (door 20 / door 4 end at |z| = 8.1). */
function buildSeqAccess(g, s) {
  const flight = (x, z0, z1, y0, y1, n = 6) => {
    const dz = (z1 - z0) / n;
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n;
      box(g, 1.3, 0.12, Math.abs(dz) + 0.02, COLOR.step, x, y0 + (y1 - y0) * t, z0 + dz * (i + 0.5));
    }
  };
  const landing = (x, yc, zc) => box(g, 2.6, 0.14, 1.4, COLOR.balcony, x, yc - 0.07, zc);
  const zF = s * (SQHD + 0.9), zB = s * 8.6, xA = s * (SQHW + 0.2), xB = s * (SQHW + 1.6);
  for (let t = 0; t < SQFLOORS - 1; t++) {
    const yFloor = t * SQFH, yMid = t * SQFH + SQFH / 2, yNext = (t + 1) * SQFH;
    landing(xA, yFloor, zF);
    flight(xA, zF - s * 0.7, zB + s * 0.7, yFloor, yMid);
    landing(xB, yMid, zB);
    flight(xB, zB + s * 0.7, zF - s * 0.7, yMid, yNext);
  }
  landing(xA, (SQFLOORS - 1) * SQFH, zF);
}

/* solid slab shell in the shared style, windows, walkway ledges under the
   upper front/back doors, corner stairs, and the number on all four faces */
function buildSeqStructure(g, number) {
  buildSlabShell(g, SQW, SQD, SQFLOORS, SQFH);

  const win = (px, py, pz, onFB) => {          // onFB: window sits on the front/back wall
    if (onFB) {
      box(g, 1.3, 1.5, 0.05, COLOR.trim, px, py, pz);
      box(g, 1.05, 1.25, 0.06, COLOR.glass, px, py, pz + Math.sign(pz) * 0.02, { roughness: 0.3, metalness: 0.1 });
    } else {
      box(g, 0.05, 1.5, 1.3, COLOR.trim, px, py, pz);
      box(g, 0.06, 1.25, 1.05, COLOR.glass, px + Math.sign(px) * 0.02, py, pz, { roughness: 0.3, metalness: 0.1 });
    }
  };
  for (let fi = 0; fi < SQFLOORS; fi++) {
    const wy = fi * SQFH + 1.55;
    for (const sz of [-1, 1]) for (const wx of [-4.9, 4.9])      // front + back, flanking the door pair
      win(wx, wy, sz * (SQHD + 0.05), true);
    // sides: between the doors on floor 1, above them on floors 2-3
    for (const sx of [-1, 1]) for (const wz of (fi === 0 ? [-5, 0, 5] : [-7.5, -2.5, 2.5, 7.5]))
      win(sx * (SQHW + 0.05), wy, wz, false);
  }

  for (let fi = 1; fi < SQFLOORS; fi++)                          // open walkways (no fence)
    for (const sz of [-1, 1])
      box(g, SQW, 0.16, 1.5, COLOR.balcony, 0, fi * SQFH - 0.06, sz * (SQHD + 0.8));
  for (const s of [1, -1]) buildSeqAccess(g, s);

  // building number over the front and back, and mid-height on each side
  for (const sz of [1, -1]) {
    const b = label(g, `Building ${number}`, 9.6, 2.0, BANNER_OPTS);
    b.position.set(0, SQH + 1.9, sz * (SQHD + 0.12));
    b.rotation.y = sz > 0 ? 0 : Math.PI;
    for (const ex of [1, -1])
      box(g, 0.16, 0.9, 0.16, COLOR.roof, ex * 4.2, SQH + 0.45, sz * (SQHD + 0.05));
  }
  for (const sx of [1, -1]) {
    const sign = label(g, `Building ${number}`, 5.0, 1.25,
      { bg: 'rgba(20,24,30,0.92)', fg: '#ffe4c2', font: 'bold 120px sans-serif', w: 1024, h: 256 });
    sign.position.set(sx * (SQHW + 0.12), SQH * 0.62, 0);
    sign.rotation.y = sx > 0 ? Math.PI / 2 : -Math.PI / 2;
  }
}

/* place all 20 doors. getUnit(door#) -> { value, mask|null }
   (mask = the partial string to show on a blank, e.g. '12__'). Doors face out. */
function buildSeqFacade(g, getUnit, raycastList, blankStates) {
  for (const slot of SQ_LAYOUT) {
    const base = slot.f * SQFH;
    let x, z, yaw, dw, dd, px, pz;
    if (slot.face === 'L' || slot.face === 'R') {
      const sx = slot.face === 'L' ? -1 : 1;
      x = sx * (SQHW + 0.02); z = slot.a; yaw = sx > 0 ? Math.PI / 2 : -Math.PI / 2;
      dw = 0.16; dd = 1.2; px = sx * (SQHW + 0.12); pz = slot.a;
    } else {
      const sz = slot.face === 'F' ? 1 : -1;
      x = slot.a; z = sz * (SQHD + 0.02); yaw = sz > 0 ? 0 : Math.PI;
      dw = 1.2; dd = 0.16; px = slot.a; pz = sz * (SQHD + 0.12);
    }

    const u = getUnit(slot.d);
    const door = box(g, dw, 2.05, dd, COLOR.door, x, base + 1.05, z);
    const plate = label(g, u.mask === null ? String(u.value) : u.mask, 1.95, 0.92,
      u.mask === null ? {} : { fg: '#c0392b' });
    plate.position.set(px, base + 2.55, pz);
    plate.rotation.y = yaw;
    if (u.mask !== null) {
      const bstate = { value: u.value, solved: false, plate, options: makeBigOptions(u.value) };
      plate.userData.bstate = bstate;
      door.userData.bstate = bstate;
      raycastList.push(plate, door);
      blankStates.push(bstate);
    }
  }
}

/* ---- ground + road (shared) ---- */
/* sub-perceptual ground noise (<= 4 % lightness per cell) so the plane isn't a flat swatch.
   The map multiplies the material colour, so the cells are near-white: the result is
   COLOR.ground varied by +-4 % lightness, never a second copy of the ground hue. */
function makeGroundNoise() {
  const S = 256, CELL = 8;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const ctx = c.getContext('2d');
  for (let y = 0; y < S; y += CELL) for (let x = 0; x < S; x += CELL) {
    const v = Math.round(255 * (1 - 0.04 * Math.random()));   // 0.96..1.00 of full: darkens by at most 4 %
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect(x, y, CELL, CELL);
  }
  /* blur the cell grid away: a soft mottle, never a visible checker */
  ctx.filter = 'blur(6px)'; ctx.drawImage(c, 0, 0); ctx.filter = 'none';
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(60, 60);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800),
  new THREE.MeshStandardMaterial({ color: COLOR.ground, roughness: 1, map: makeGroundNoise() }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.17;
ground.receiveShadow = true; scene.add(ground);

const road = new THREE.Mesh(new THREE.PlaneGeometry(800, 6),
  new THREE.MeshStandardMaterial({ color: COLOR.road, roughness: 1 }));
road.rotation.x = -Math.PI / 2; road.position.set(0, -0.15, HALF_D + 5.4);
road.receiveShadow = true; scene.add(road);

/* kerb strips either side of the road */
for (const s of [-1, 1]) box(scene, 800, 0.08, 0.35, COLOR.walkway, 0, -0.11, HALF_D + 5.4 + s * 3.2);

function makeOptions(correct) {
  const pool = [];
  for (const d of [-3, -2, -1, 1, 2, 3, 5, -5, 7, 10, -10]) {
    const n = correct + d;
    if (n > 100 && n !== correct) pool.push(n);
  }
  shuffle(pool);
  const distract = [];
  for (const n of pool) {
    if (distract.length >= 3) break;
    if (!distract.includes(n)) distract.push(n);
  }
  return shuffle([correct, ...distract]);
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* distractors for the big 4-5 digit units: nudge the suffix (±2,±4),
   the floor digit (±100) or the building (±1000) so wrong answers stay
   tempting and on-pattern. */
function makeBigOptions(correct) {
  const pool = [];
  for (const d of [-2, 2, -4, 4, -6, 6, -100, 100, -200, 200, -1000, 1000]) {
    const n = correct + d;
    if (n > 0 && n !== correct) pool.push(n);
  }
  shuffle(pool);
  const distract = [];
  for (const n of pool) {
    if (distract.length >= 3) break;
    if (!distract.includes(n)) distract.push(n);
  }
  return shuffle([correct, ...distract]);
}

function buildStageGroup(i) {
  const st = STAGES[i];
  const g = new THREE.Group();
  scene.add(g);
  const raycastList = [], blankStates = [];
  let buildingState = null;

  if (st.type === 'tower') {
    buildTowerShell(g, st.label);
    buildTowerAccess(g);
    if (st.kind === 'example') {
      buildTowerFacade(g, (fi, ii) => ({ type: 'num', value: (fi + 1) * 100 + st.suffixes[ii] }),
        raycastList, blankStates);
      addTowerArrows(g);
    } else {
      const blankSet = new Set(st.blanks);
      buildTowerFacade(g, (fi, ii) => {
        const v = (fi + 1) * 100 + st.suffixes[ii];
        return { type: blankSet.has(v) ? 'blank' : 'num', value: v };
      }, raycastList, blankStates);
    }
  } else if (st.type === 'row') {
    buildSlabShell(g, RW, RD, RFLOORS, RFH);
    const named = st.kind === 'example' || !st.chooseBuilding;
    const banner = addTopBanner(g, RH, RHALF_D, named ? `Building ${st.building}` : 'Building ?');
    buildRowFacade(g, st.floors, raycastList, blankStates);
    if (st.kind === 'quiz' && st.chooseBuilding) {
      buildingState = {
        value: st.building, solved: false, plate: banner,
        options: shuffle([...st.buildingOptions]),
        header: 'Which building is this?<small>Read the leading digit(s)</small>',
        solvedText: v => `Building ${v}`, plateOpts: BANNER_OPTS,
      };
    }
  } else if (st.type === 'block') {
    buildSlabShell(g, BW, BD, BFLOORS, BFH);
    buildBlockAccess(g);
    addTopBanner(g, BH, BHALF_D, `Building ${st.building}`);
    addBlockSideSigns(g, `Building ${st.building}`);
    const blanksMap = st.blanks || {};
    const cell = (isFront, fi, di) => {
      const value = blockUnit(st.building, isFront, fi, di);
      return { value, mask: blanksMap[value] || null };
    };
    buildBlockFacade(g, 1, true, (fi, di) => cell(true, fi, di), raycastList, blankStates);
    buildBlockFacade(g, -1, false, (fi, di) => cell(false, fi, di), raycastList, blankStates);
    // no arrows or floor badges here — the learner figures out the pattern
  } else if (st.type === 'seq') {
    buildSeqStructure(g, st.building);
    const blanksMap = st.blanks || {};
    buildSeqFacade(g, d => ({ value: st.base + d, mask: blanksMap[d] || null }),
      raycastList, blankStates);
    // solid walk-up block — read the doors around the outside
  } else {
    buildShell(g, st.number);
    if (st.kind === 'example') {
      const u = (fo, fi, ii) => ({ type: 'num', value: st.start + fo * 4 + fi * 2 + ii });
      buildFacade(g, 1, true, u, raycastList, blankStates);
      buildFacade(g, -1, false, u, raycastList, blankStates);
      addArrows(g);
    } else {
      const blankSet = new Set(st.blanks);
      buildFacade(g, 1, true, (fo, fi, ii) => {
        const v = st.start + fi * 2 + ii;
        return { type: blankSet.has(v) ? 'blank' : 'num', value: v };
      }, raycastList, blankStates);
      // back of a course building carries no numbers (its units belong to the next building)
      buildFacade(g, -1, false, () => ({ type: 'none' }), raycastList, blankStates);
    }
  }

  g.userData = { raycastList, blankStates, buildingState };
  return g;
}
