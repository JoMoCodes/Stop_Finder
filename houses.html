<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Stop Finder — Houses</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .hidden { display: none !important; }

  /* ---- accessibility: same palette and contrast as the apartment course
     (amber #ffd9a0, grey #9fb0c0, success #7ee0a0, error #ff9a8a on #14181e;
     blank #c0392b on the white plate; text #08130c on green #57c97e) ---- */
  .sr-only { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  button:focus-visible, canvas:focus-visible, [tabindex]:focus-visible { outline:3px solid #ffd54a; outline-offset:2px; box-shadow:0 0 0 6px rgba(20,24,30,.9); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    button.opt.wrong { animation:none !important; }
  }

  /* top prompt */
  #prompt {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    width: min(680px, calc(100% - 32px));
    background: rgba(20, 24, 30, 0.9); backdrop-filter: blur(6px);
    color: #eef2f6; border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px; padding: 14px 20px 15px;
    box-shadow: 0 10px 34px rgba(0,0,0,0.4); z-index: 10; text-align: left;
  }
  #prompt .ptitle { color: #ffd9a0; font-weight: 700; font-size: 17px; line-height: 1.3; margin-bottom: 4px; }
  #prompt .pbody  { color: #dfe6ee; font-size: 15px; line-height: 1.5; }
  #prompt .pbody b { color: #ffd9a0; font-weight: 600; }
  #prompt .pbody i { font-style: normal; color: #eef2f6; text-decoration: underline dotted; }
  #prompt .pbody .nb { white-space: nowrap; }
  #prompt b { color: #ffd9a0; }

  /* buttons */
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 999px;
    padding: 13px 30px; font-size: 16px; font-weight: 600; color: #08130c;
    background: #57c97e; box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    transition: transform .1s ease, background .12s ease;
  }
  button:hover { transform: translateY(-2px); background: #6fe096; }
  button.ghost {
    background: rgba(255,255,255,0.10); color: #eef2f6;
    border: 1px solid rgba(255,255,255,0.20); font-weight: 500; padding: 11px 20px;
  }
  button.ghost:hover { background: rgba(255,255,255,0.18); }
  button:disabled, button.ghost:disabled { opacity: .45; cursor: default; transform: none; }
  #resetview { position: fixed; right: 22px; bottom: 80px; z-index: 11; padding: 9px 14px; font-size: 14px; }

  /* bottom button bar (Back / Next between streets) */
  #bottombar {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; align-items: center; gap: 10px;
  }

  /* per-street chip, first-run hint, help button */
  #doorsleft {
    position: fixed; top: 16px; right: 16px; z-index: 11; padding: 9px 14px; border-radius: 999px;
    background: rgba(20,24,30,0.90); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.14);
    color: #eef2f6; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  #doorsleft b { color: #ffd54a; }
  #doorsleft.done { color: #7ee0a0; }

  #draghint {
    position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%);
    width: min(470px, calc(100% - 32px)); display: flex; gap: 14px; align-items: center;
    padding: 12px 16px; border-radius: 14px; background: rgba(20,24,30,0.92);
    border: 1px solid rgba(255,213,74,0.45); color: #eef2f6; font-size: 14px; line-height: 1.45;
    z-index: 12; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    opacity: 0; transition: opacity .3s ease; pointer-events: none;
  }
  #draghint.show { opacity: 1; }
  #draghint b { color: #ffd9a0; }
  #draghint svg { width: 64px; flex: none; }

  #helpbtn {
    position: fixed; right: 22px; bottom: 28px; width: 40px; height: 40px; padding: 0;
    border-radius: 50%; font-size: 18px; z-index: 11;
    display: flex; align-items: center; justify-content: center;
  }

  /* site bar: this course has one look, so the bar is just the Home button */
  #lookbar {
    position: fixed; right: 74px; bottom: 28px; z-index: 11;
    display: flex; align-items: center; gap: 4px;
    padding: 4px; border-radius: 999px; font-size: 13px; color: #9fb0c0;
    background: rgba(20,24,30,0.90); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  #lookbar a.lk-home {
    display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px 0 10px;
    border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 13px;
    color: #1a1400; background: #ffd54a; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    transition: transform .1s ease, background .12s ease;
  }
  #lookbar a.lk-home svg { width: 16px; height: 16px; flex: none; }
  #lookbar a.lk-home:hover { background: #ffe07a; transform: translateY(-1px); }
  #lookbar a.lk-home:focus-visible { outline: 3px solid #fff; outline-offset: 2px; box-shadow: 0 0 0 6px rgba(20,24,30,.9); }

  /* walk bar: turn left · walk to the next viewpoint · turn right */
  #viewbar {
    position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
    z-index: 11; display: flex; align-items: center; gap: 6px;
    background: rgba(20,24,30,0.90); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
    padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  #viewbar button.vbtn { padding: 0 14px; min-height: 40px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  #viewbar button.vbtn.turn { width: 40px; padding: 0; justify-content: center; font-size: 18px; }
  #viewbar button.vbtn.walk { background: #57c97e; color: #08130c; border-color: transparent; font-weight: 600; }
  #viewbar button.vbtn.walk:hover:not(:disabled) { background: #6fe096; }
  #viewbar button.vbtn.walk:disabled { background: rgba(255,255,255,0.10); color: #eef2f6; }

  /* digit-place palette: block · lot · side, shared by the quiz, prompt, report and 3D key */
  :root { --c-block:#f28c6a; --c-lot:#eef2f6; --c-side:#7cc4ff; --c-path:#ffd54a; }
  .pl-block{color:var(--c-block)} .pl-lot{color:var(--c-lot)} .pl-side{color:var(--c-side)}
  .pl-building{color:var(--c-block)} .pl-floor{color:var(--c-side)} .pl-door{color:var(--c-lot)}

  /* street map (Street View style): viewpoints you can tap, "you are here" */
  #minimap{position:fixed;left:22px;bottom:28px;z-index:11;width:236px;padding:8px 8px 6px;border-radius:14px;background:rgba(20,24,30,.9);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.45)}
  #minimap svg{display:block;width:100%;height:auto}
  #minimap .mmnote{color:#9fb0c0;font-size:10px;text-align:center;margin-top:4px}
  #minimap circle.node{cursor:pointer}

  /* top-left "jump to part" menu */
  #jumpbar {
    position: fixed; top: 16px; left: 16px; z-index: 11;
    background: rgba(20,24,30,0.90); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 14px;
    padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  #jumpbar .jbtitle { color: #9fb0c0; font-size: 12px; text-align: center; margin-bottom: 8px; }
  #jumpbar .jbtns { display: flex; gap: 8px; }
  #jumpbar button.jbtn {
    width: 40px; height: 40px; padding: 0; font-size: 15px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  #jumpbar button.jbtn.active { background: #57c97e; color: #08130c; border-color: transparent; }

  /* course progress: one segment per street */
  #progress { display: flex; gap: 3px; margin-top: 8px; height: 6px; }
  #progress .seg { flex: 1; border-radius: 3px; background: rgba(255,255,255,0.18); }
  #progress .seg.done { background: #57c97e; }
  #progress .seg.now { background: #ffd9a0; }
  #progress .seg.part { margin-left: 6px; }

  /* end-of-run report: the dialog shell; contents come from report.js */
  #finale {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(580px, calc(100% - 32px)); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px);
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    padding: 20px 24px 24px; border-radius: 18px;
    background: rgba(20,24,30,0.94); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.16); color: #eef2f6; z-index: 40;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: finale-in .2s ease-out;
  }
  #finale:focus { outline: none; }
  @keyframes finale-in { from { opacity: 0; transform: translate(-50%, calc(-50% + 8px)); } }
  #finale .factions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* right-side quiz panel */
  #quiz {
    position: fixed; top: 50%; right: 22px; transform: translateY(-50%);
    width: 248px; z-index: 11;
    background: rgba(20,24,30,0.90); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 14px;
    padding: 38px 16px 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  #quiz .qhead { color: #eef2f6; font-weight: 600; margin-bottom: 12px; text-align: center; }
  #quiz .qhead small { display: block; color: #9fb0c0; font-weight: 400; font-size: 12px; margin-top: 3px; line-height: 1.4; }
  #qclose {
    position: absolute; top: 5px; right: 6px; width: 32px; height: 32px; padding: 0;
    border-radius: 50%; font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #qkey {
    display: flex; gap: 10px; justify-content: center; font-size: 11px;
    text-transform: uppercase; letter-spacing: .06em; color: #9fb0c0; margin: -6px 0 10px;
  }
  #qopts { display: flex; flex-direction: column; gap: 8px; }
  button.opt {
    background: rgba(255,255,255,0.08); color: #eef2f6;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 10px;
    display: flex; align-items: center; gap: 10px; min-height: 48px;
    padding: 10px 14px; font-size: 16px; font-weight: 600; text-align: left;
    line-height: 1.5; box-shadow: none;
    transition: background .12s, transform .12s, border-color .12s;
  }
  button.opt:hover { transform: none; }
  button.opt:hover:not(:disabled) {
    background: rgba(255,255,255,0.16); transform: translateX(3px);
    border-color: rgba(255,217,160,0.6);
  }
  button.opt .ltr { width: 22px; color: #9fb0c0; font-weight: 500; }
  button.opt .num {
    font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum"; letter-spacing: .02em;
  }
  .pl + .pl { margin-left: .14em; }
  button.opt.wrong { background: rgba(229,57,53,0.32); border-color: rgba(229,57,53,0.75); animation: shake .42s; }
  button.opt.right { background: rgba(87,201,126,0.28); border-color: rgba(87,201,126,0.7); }
  button.opt:disabled { cursor: default; opacity: 1; }
  #qmsg { margin-top: 12px; text-align: center; font-size: 14px; min-height: 20px; line-height: 1.4; }
  #qmsg.ok { color: #7ee0a0; }
  #qmsg.bad { color: #ff9a8a; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

  /* ============================================================
     RESPONSIVE / MOBILE LAYOUT — overrides only, all in media queries
     ============================================================ */
  @media (pointer: coarse) {
    button { min-height: 44px; }
    #jumpbar button.jbtn { width: 44px; height: 44px; }
    button.opt { min-height: 52px; }
    #lookbar a.lk-home { min-height: 44px; }
    #qclose { width: 44px; height: 44px; }
    #viewbar button.vbtn { min-height: 44px; }
    #viewbar button.vbtn.turn { width: 44px; }
  }

  /* --- tablets 641-1024px --- */
  @media (min-width: 641px) and (max-width: 1024px) {
    #quiz { right: 12px; width: 248px; }
    #jumpbar { top: calc(var(--prompt-h, 140px) + 16px); }
    #doorsleft { top: calc(var(--prompt-h, 140px) + 16px); }
  }

  /* --- phones, portrait --- */
  @media (max-width: 640px) {
    #prompt { top: 8px; left: 8px; right: 8px; width: auto; transform: none; padding: 10px 12px 11px;
      max-height: 34vh; overflow-y: auto; overscroll-behavior: contain; }
    #prompt .ptitle { font-size: 16px; }
    #prompt .pbody { font-size: 15px; }

    #jumpbar { top: calc(var(--prompt-h, 140px) + 16px); left: 8px; padding: 6px; }
    #jumpbar .jbtitle { display: none; }
    #jumpbar .jbtns { gap: 8px; }
    #progress { margin-top: 6px; }

    #lookbar { top: auto; bottom: 70px; left: 8px; right: auto; padding: 4px; }
    #doorsleft { top: calc(var(--prompt-h, 140px) + 16px + 74px); right: 8px; left: auto; }

    #bottombar { bottom: 12px; gap: 8px; width: calc(100% - 16px); justify-content: center; }
    #bottombar button { padding: 12px 18px; font-size: 15px; min-height: 46px; }

    /* walk bar sits above Back / Next, between Home (left) and the map (right) */
    #viewbar { bottom: 68px; left: 50%; transform: translateX(-50%); gap: 4px; padding: 4px; }
    #viewbar button.vbtn { padding: 0 10px; font-size: 14px; }
    #viewbar button.vbtn .vlabel { display: none; }
    #viewbar button.vbtn.walk { width: 44px; padding: 0; justify-content: center; font-size: 18px; }

    #helpbtn   { right: 8px; bottom: auto; top: calc(var(--prompt-h, 140px) + 16px + 74px + 50px); left: auto; width: 44px; height: 44px; }
    #resetview { right: 8px; bottom: 122px; left: auto; padding: 0; width: 44px; height: 44px; }
    #resetview .rv-label { display: none; }
    #minimap   { right: 8px; bottom: 172px; left: auto; top: auto; width: 128px; padding: 5px 5px 3px; }
    #minimap .mmnote { display: none; }
    #draghint  { left: 8px; right: 8px; width: auto; top: 46%; bottom: auto; transform: none; }

    #quiz { top: auto; bottom: 0; left: 0; right: 0; width: auto; transform: none; z-index: 30;
      border-radius: 16px 16px 0 0; border-bottom: none; max-height: 60vh; overflow-y: auto;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
    #qopts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.opt { min-height: 56px; display: flex; align-items: center; justify-content: center; }
    button.opt .ltr { display: none; }
    button.opt .num { font-size: 24px; }
    #qclose { width: 44px; height: 44px; top: 4px; right: 4px; }
    #finale { inset: 0; transform: none; width: auto; max-height: none; border-radius: 0;
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); animation: none; }
  }

  @media (max-width: 360px) {
    #minimap { width: 104px; bottom: 160px; }
  }

  /* --- phones, landscape --- */
  @media (max-height: 520px) and (orientation: landscape) {
    #prompt { top: 8px; left: 8px; right: auto; transform: none; width: min(52vw, 460px);
      max-height: 44vh; overflow-y: auto; padding: 8px 12px; }
    #prompt .ptitle { font-size: 14px; }
    #prompt .pbody { font-size: 13px; }

    #jumpbar { top: auto; bottom: 8px; left: 8px; padding: 6px; }
    #jumpbar .jbtitle { display: none; }

    #bottombar { bottom: 8px; left: auto; right: 8px; transform: none; }
    #bottombar button { padding: 9px 16px; font-size: 14px; }

    #viewbar { top: auto; bottom: 8px; left: 284px; transform: none; padding: 4px; gap: 4px; }
    #viewbar button.vbtn { padding: 0 10px; font-size: 13px; }
    #viewbar button.vbtn .vlabel { display: none; }
    #viewbar button.vbtn.walk { width: 44px; padding: 0; justify-content: center; font-size: 18px; }

    #quiz { top: 8px; bottom: 8px; right: 8px; left: auto; width: 236px;
      max-height: none; transform: none; border-radius: 14px; overflow-y: auto; }
    #qopts { display: flex; flex-direction: column; }

    #minimap { right: 252px; top: 8px; bottom: auto; left: auto; width: 150px; padding: 5px 5px 3px; }
    #minimap .mmnote { display: none; }
    #doorsleft { top: calc(var(--prompt-h, 140px) + 16px); left: 8px; right: auto; }
    #draghint { left: 8px; right: auto; width: min(52vw, 460px); top: calc(var(--prompt-h, 140px) + 60px); bottom: auto; transform: none; }
    #helpbtn { display: none; }
    #resetview { right: 8px; bottom: 112px; left: auto; padding: 0; width: 44px; height: 44px; }
    #resetview .rv-label { display: none; }

    #lookbar { top: 8px; right: 8px; bottom: auto; left: auto; z-index: 10; }

    #finale { inset: 8px; transform: none; width: auto; max-height: none; border-radius: 14px;
      padding: 12px 16px 16px; animation: none; }
  }
</style>
</head>
<body>
<!-- end-of-run report (shown after the last street) -->
<div id="finale" class="hidden" role="dialog" aria-modal="true" aria-labelledby="ftitle" aria-describedby="fsum" tabindex="-1">
  <div id="report"></div>
  <div class="factions"><button id="fagain">Start over ▸</button><button id="fclose" class="ghost">Keep looking around</button></div>
</div>

<div id="app"></div>

<!-- screen-reader text for the 3D scene, where you are standing, and a keyboard route to every blank house -->
<p id="scene-desc" class="sr-only"></p>
<p id="walkstatus" class="sr-only" aria-live="polite" aria-atomic="true"></p>
<div id="doorlist" class="sr-only" role="group" aria-label="Houses to fill in"></div>

<div id="prompt" aria-live="polite" aria-atomic="true"></div>

<!-- right-side multiple-choice panel -->
<div id="quiz" class="hidden" role="dialog" aria-labelledby="qhead">
  <button id="qclose" class="ghost" aria-label="Close">×</button>
  <div class="qhead" id="qhead">Which house is this?<small>Pick the number that fits the pattern</small></div>
  <div id="qkey" class="hidden"><span class="pl pl-block">block</span><span class="pl pl-lot">lot</span></div>
  <div id="qopts"></div>
  <div id="qmsg" aria-live="assertive" aria-atomic="true"></div>
</div>

<!-- walk bar: turn, step to the next viewpoint, turn -->
<div id="viewbar" role="group" aria-label="Walk along the street">
  <button class="ghost vbtn turn" data-view="turn-left" aria-label="Turn left">◀</button>
  <button class="ghost vbtn walk" data-view="walk" aria-label="Walk to the next viewpoint ahead"><span aria-hidden="true">▲</span><span class="vlabel">Walk</span></button>
  <button class="ghost vbtn turn" data-view="turn-right" aria-label="Turn right">▶</button>
</div>

<!-- street map: viewpoints, houses, blocks, "you are here" -->
<div id="minimap" aria-hidden="true"><svg viewBox="0 0 220 110"></svg><div class="mmnote">Tap a dot to walk there</div></div>

<!-- jump menu: skip to the example street of any part -->
<div id="jumpbar" role="navigation" aria-label="Jump to part">
  <div class="jbtitle">Jump to part</div>
  <div class="jbtns">
    <button class="ghost jbtn" data-part="1" aria-label="Part 1: odd numbers on one side, even on the other">1</button>
    <button class="ghost jbtn" data-part="2" aria-label="Part 2: numbers rise away from the start of the street">2</button>
    <button class="ghost jbtn" data-part="3" aria-label="Part 3: each block is a new hundred">3</button>
    <button class="ghost jbtn" data-part="4" aria-label="Part 4: gaps in the numbers are normal">4</button>
    <button class="ghost jbtn" data-part="5" aria-label="Part 5: numbers round a court">5</button>
  </div>
  <div id="progress" aria-hidden="true"></div>
</div>

<div id="doorsleft" class="hidden" aria-live="polite"></div>

<div id="draghint" class="hidden" role="status">
  <svg viewBox="0 0 64 40" aria-hidden="true" fill="none" stroke="#ffd54a" stroke-width="2.2"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 37v-6.5l-4.6-5.1a2.6 2.6 0 0 1 3.7-3.7l1.9 1.9V10.5a2.4 2.4 0 0 1 4.8 0v8.2" />
    <path d="M32.8 19.6a2.4 2.4 0 0 1 4.8 0v1.8" />
    <path d="M37.6 21.4a2.4 2.4 0 0 1 4.8 0v8.3a7 7 0 0 1-2 4.9V37" />
    <path d="M15 16.5 9.5 22l5.5 5.5" /><path d="M9.5 22h8.5" />
    <path d="M49 16.5 54.5 22 49 27.5" /><path d="M54.5 22H46" />
  </svg>
  <div><b>Drag</b> to look around · Click the <b>arrows on the road</b> to walk · <b>Scroll / pinch</b> to zoom · Click a house marked <b>?</b> to answer</div>
</div>

<button id="helpbtn" class="ghost" aria-label="How to use the controls">?</button>

<!-- site bar: Home (this course has a single look, so no Appearance menu) -->
<nav id="lookbar" aria-label="Home">
  <a class="lk-home" href="https://jomocodes.github.io/Stop_Finder/" aria-label="Home: back to the Stop Finder menu">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5" /><path d="M5.5 10v10h13V10" /><path d="M10 20v-6h4v6" />
    </svg>
    <span>Home</span>
  </a>
</nav>

/* split a house number into its places. Parts 1-2 and the running-count

function splitPlaces(str, type) {

}
/* the cross street at the low end of block h is the (h-1)th Ave; Main St before block 1 */

/* ============================================================
   scene

const app = document.getElementById('app');

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 1400);

const renderer = new THREE.WebGLRenderer({ antialias: true });

const hemi = new THREE.HemisphereLight(0xfff5e6, 0x6f7a5a, 0.62);

sun.shadow.camera.near = 1; sun.shadow.camera.far = 160;
sun.shadow.camera.left = -48; sun.shadow.camera.right = 48;

}
aimSun(0, 0);

/* sky dome + fog */
const skyGeo = new THREE.SphereGeometry(1000, 32, 16);
{
  const col = [], top = new THREE.Color(0x6aa0d8), hor = new THREE.Color(0xe2ebf1), c = new THREE.Color();
  const pos = skyGeo.attributes.position;

/* ---- helpers ---- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.9, ...opts });
}
function box(parent, w, h, d, color, x, y, z, opts = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts));
  m.castShadow = true; m.receiveShadow = true;
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
/* a flat rectangle lying on the ground (y up) */
function slab(parent, w, d, color, x, y, z, opts = {}) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat(color, { roughness: 1, ...opts }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y, z);
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* ---- plate / sign typography (same system as the apartment course) ----
   numerals that fill their plate, and a blank style that reads without
   colour: dashed frame + hollow boxes where digits are missing. */
const PLATE_FONT = '"Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif';
const PLATE_FG = '#16202b', PLATE_BG = 'rgba(255,255,255,0.96)';
const BLANK_FG = '#c0392b';
const BLANK_ON_DARK = '#ffd9a0';
const BLANK_DASH = { width: 14, dash: [40, 26], inset: 22 };

function isDarkBg(css) {
  if (!css) return false;
  let r = 255, g = 255, b = 255;
  const m = /rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)/.exec(css);
  if (m) { r = +m[1]; g = +m[2]; b = +m[3]; }
  else if (css[0] === '#') {
    const hx = css.slice(1), t = hx.length === 3 ? hx.replace(/./g, c => c + c) : hx;
    r = parseInt(t.slice(0, 2), 16); g = parseInt(t.slice(2, 4), 16); b = parseInt(t.slice(4, 6), 16);
  }
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 < 0.5;
}
function drawDigitBox(ctx, x, baselineY, adv, cap, color) {
  const bw = adv * 0.84, bh = cap * 0.78, r = Math.min(bw, bh) * 0.18;
  ctx.save();

  ctx.lineWidth = Math.max(2, cap * 0.09);

  else ctx.rect(x + (adv - bw) / 2, baselineY - bh, bw, bh);
  ctx.stroke();
  ctx.restore();
}
function makeTextTexture(text, opts = {}) {
  const s = String(text);
  const isBlank = /[?_]/.test(s);
  const wide = s.length > 3;
  const { w = wide ? 768 : 512, h = wide ? 384 : 256,
    bg = PLATE_BG, fg = PLATE_FG, font = 'bold 170px sans-serif', pad: extraPad = 0 } = opts;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h); }

  const weight = fm ? fm[1].trim() : 'bold';
  const base = fm ? parseFloat(fm[2]) : 170;
  const fontAt = px => `${weight} ${px}px ${PLATE_FONT}`.trim();
  const k = w / 1024, dashLw = BLANK_DASH.width * k, dashInset = BLANK_DASH.inset * k + dashLw / 2;
  const pad = (isBlank ? dashInset + dashLw : 0) + extraPad * k;
  const availW = w - 2 * pad, availH = h - 2 * pad;
  const probe = s.replace(/_/g, '0');
  ctx.font = fontAt(100);
  const pm = ctx.measureText(probe);
  const wPer = (pm.width || 50) / 100;
  const ascPer = (pm.actualBoundingBoxAscent || 72) / 100;
  const descPer = (pm.actualBoundingBoxDescent || 0) / 100;
  const px = Math.max(8, Math.min(0.86 * availW / wPer, 0.72 * availH / ascPer,
    0.88 * availH / (ascPer + descPer), 1.35 * base * (h / 256)));
  ctx.font = fontAt(px);
  const dm = ctx.measureText('0');
  const cap = dm.actualBoundingBoxAscent || px * 0.72;
  const asc = ascPer * px, desc = descPer * px;
  const baselineY = (h - (asc + desc)) / 2 + asc;
  const blankFg = isDarkBg(bg) ? BLANK_ON_DARK : BLANK_FG;
  if (isBlank) {
    ctx.save();
    ctx.strokeStyle = blankFg; ctx.lineWidth = dashLw;

    ctx.restore();

    ctx.textAlign = 'left';
    const adv = ch => ctx.measureText(ch === '_' ? '0' : ch).width;
    const chars = Array.from(s);
    let x = (w - chars.reduce((t, ch) => t + adv(ch), 0)) / 2;
    for (const ch of chars) {
      const a = adv(ch);

      else { ctx.fillStyle = ch === '?' ? blankFg : fg; ctx.fillText(ch, x, baselineY); }

}
function label(parent, text, pw, ph, texOpts = {}, matOpts = {}) {

    new THREE.MeshBasicMaterial({ map: makeTextTexture(text, texOpts), transparent: true, ...matOpts }));
  parent.add(m); return m;
}
/* text that reads correctly from both sides: two planes back to back */
function labelTwoSided(parent, text, pw, ph, texOpts = {}) {
  const g = new THREE.Group();
  const tex = makeTextTexture(text, texOpts);
  for (const s of [1, -1]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    m.rotation.y = s > 0 ? 0 : Math.PI; m.position.z = s * 0.006;

}
function setPlateText(plate, text, texOpts = {}) {

/* a dark caption board (multi-line, centred) on a canvas, for the guides */
function boardTexture(lines, opts = {}) {
  const { w = 1024, h = 320, bg = 'rgba(20,24,30,0.92)', fg = '#ffe4c2', size = 92, accent = '#ffd54a' } = opts;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const r = 28;
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(w - r, 0); ctx.quadraticCurveTo(w, 0, w, r);
  ctx.lineTo(w, h - r); ctx.quadraticCurveTo(w, h, w - r, h);
  ctx.lineTo(r, h); ctx.quadraticCurveTo(0, h, 0, h - r);
  ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath(); ctx.fill();

  const n = lines.length, lh = size * 1.25;
  lines.forEach((ln, i) => {

    ctx.fillStyle = big.color || (i === 0 ? accent : fg);
    ctx.font = `${big.weight || (i === 0 ? 'bold' : '600')} ${big.size || size}px ${PLATE_FONT}`;
    ctx.fillText(big.text, w / 2, h / 2 + (i - (n - 1) / 2) * lh);
  });

  return tex;
}
function board(parent, lines, pw, ph, x, y, z, yaw, opts = {}) {

  for (const s of [1, -1]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    m.rotation.y = s > 0 ? 0 : Math.PI; m.position.z = s * 0.006;
    g.add(m);
  }

  parent.add(g);

}

/* ---- a bright 3D arrow from -> to ---- */
function arrow(parent, from, to, color, radius = 0.1) {
  const dir = to.clone().sub(from);
  const len = dir.length();
  const shaftLen = Math.max(0.05, len - 0.7);
  const grp = new THREE.Group();
  const m = new THREE.MeshBasicMaterial({ color });
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, shaftLen, 12), m);
  shaft.position.y = shaftLen / 2;
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.7, 16), m);
  head.position.y = shaftLen + 0.35;
  grp.add(shaft, head);
  grp.position.copy(from);
  grp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  parent.add(grp);
  return grp;
}

/* ---- ground (shared) ---- */
function makeGroundNoise() {
  const S = 256, CELL = 8;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const ctx = c.getContext('2d');
  for (let y = 0; y < S; y += CELL) for (let x = 0; x < S; x += CELL) {
    const v = Math.round(255 * (1 - 0.05 * Math.random()));
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect(x, y, CELL, CELL);

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200),
  new THREE.MeshStandardMaterial({ color: COLOR.ground, roughness: 1, map: makeGroundNoise() }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02;
ground.receiveShadow = true; scene.add(ground);

/* asphalt with a faint speckle so long roads don't read as one flat swatch */
function makeAsphalt() {
  const S = 128;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 900; i++) {
    const v = 225 + Math.floor(Math.random() * 30);
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect(Math.random() * S, Math.random() * S, 1.5, 1.5);

}
const ASPHALT = makeAsphalt();
function roadMat() {
  const t = ASPHALT.clone(); t.needsUpdate = true;
  return new THREE.MeshStandardMaterial({ color: COLOR.road, roughness: 1, map: t });
}

/* ============================================================
   street furniture builders
   ============================================================ */

/* a straight stretch of road along x from x0 to x1 (centre line z = 0),
   with kerbs and sidewalks either side, a dashed centre line, and lawn
   strips out to the lots */
function buildRoad(g, x0, x1, { centreLine = true } = {}) {
  const len = x1 - x0, cx = (x0 + x1) / 2;
  const road = slab(g, len, HALF_ROAD * 2, COLOR.road, cx, 0.0, 0);
  road.material = roadMat(); road.material.map.repeat.set(len / 6, 2);
  if (centreLine) {
    const n = Math.floor(len / 6);
    for (let i = 0; i < n; i++) slab(g, 3, 0.16, 0xe6d27a, x0 + 3 + i * 6, 0.012, 0);
  }
}
/* a cross street running along z through the main road, between x0 and x1 */
function buildCrossStreet(g, x0, x1, depth = 60) {
  const cx = (x0 + x1) / 2, w = x1 - x0;
  const r = slab(g, w, depth * 2, COLOR.road, cx, 0.001, 0);
  r.material = roadMat(); r.material.map.repeat.set(2, depth / 3);
  for (const s of [-1, 1]) {                          // kerbs along the cross street, clear of the junction
    const zc = s * (HALF_ROAD + WALK_W + (depth - HALF_ROAD - WALK_W) / 2);
    const zl = depth - HALF_ROAD - WALK_W;
    for (const e of [-1, 1]) {
      box(g, 0.32, 0.14, zl, COLOR.kerb, cx + e * (w / 2 + 0.16), 0.07, zc);
      slab(g, WALK_W - 0.32, zl, COLOR.walk, cx + e * (w / 2 + 0.32 + (WALK_W - 0.32) / 2), 0.13, zc);
    }
  }
  // a stop line at each side of the junction
  for (const s of [-1, 1]) slab(g, w - 1, 0.4, 0xf2f2f2, cx, 0.012, s * (HALF_ROAD + 0.6));
}

const SIGN_OPTS = { bg: '#1f6b3d', fg: '#ffffff', font: 'bold 130px sans-serif', w: 1024, h: 200, pad: 40 };
/* a street sign pole at (x, z) with two blades: `along` names the main
   street (blade parallel to x, block number appended) and `across` the
   cross street (blade parallel to z). Blades read from both sides. */
function buildSignPole(g, x, z, along, across, block) {
  box(g, 0.1, 3.2, 0.1, COLOR.post, x, 1.6, z);
  const a = labelTwoSided(g, block != null ? `${along.toUpperCase()}  ${block}` : along.toUpperCase(), 2.2, 0.42, SIGN_OPTS);
  a.position.set(x, 3.05, z); a.rotation.y = 0;
  const b = labelTwoSided(g, across.toUpperCase(), 2.0, 0.42, SIGN_OPTS);
  b.position.set(x, 2.58, z); b.rotation.y = Math.PI / 2;
  return [a, b];
}

/* a tree: trunk + a rounded canopy (two spheres) */
function buildTree(g, x, z, r) {
  const h = 2.2 + r() * 1.4, cr = 1.4 + r() * 1.1;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.2, h, 8), mat(COLOR.trunk));
  trunk.position.set(x, h / 2, z); trunk.castShadow = true; g.add(trunk);
  const leaf = mat(COLOR.leaf[Math.floor(r() * COLOR.leaf.length)], { roughness: 0.95 });
  const c1 = new THREE.Mesh(new THREE.SphereGeometry(cr, 12, 10), leaf);
  c1.position.set(x, h + cr * 0.6, z); c1.castShadow = true; g.add(c1);
  const c2 = new THREE.Mesh(new THREE.SphereGeometry(cr * 0.7, 10, 8), leaf);
  c2.position.set(x + cr * 0.4, h + cr * 1.1, z - cr * 0.3); c2.castShadow = true; g.add(c2);
}
/* a low hedge / shrub row */
function buildShrubs(g, x0, x1, z, r) {
  const n = Math.max(1, Math.round((x1 - x0) / 1.3));
  const leaf = mat(COLOR.leaf[Math.floor(r() * COLOR.leaf.length)]);
  for (let i = 0; i < n; i++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.5 + r() * 0.2, 8, 6), leaf);
    s.position.set(x0 + (i + 0.5) * (x1 - x0) / n, 0.45, z); s.scale.y = 0.75; s.castShadow = true; g.add(s);
  }
}
/* a parked car: body + cabin + wheels, pointing along its local x */
function buildCar(g, x, z, yaw, color) {
  const car = new THREE.Group();
  box(car, 4.3, 0.7, 1.8, color, 0, 0.6, 0, { roughness: 0.5, metalness: 0.25 });
  box(car, 2.3, 0.6, 1.6, color, -0.1, 1.25, 0, { roughness: 0.5, metalness: 0.25 });
  box(car, 2.0, 0.5, 1.62, COLOR.glass, -0.1, 1.28, 0, { roughness: 0.25, metalness: 0.2 });
  for (const wx of [-1.4, 1.4]) for (const wz of [-0.85, 0.85]) {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.24, 14), mat(0x1c1c1c));
    w.rotation.x = Math.PI / 2; w.position.set(wx, 0.34, wz); w.castShadow = true; car.add(w);
  }
  car.position.set(x, 0, z); car.rotation.y = yaw;
  g.add(car);
}

/* ---- house styles: siding, roof colour, storeys, gable direction, garage ---- */
const PLATE_W = 1.15, PLATE_H = 0.52;        // beside the door
const MB_PLATE_W = 0.56, MB_PLATE_H = 0.26;  // on the mailbox

/* a house group: the front wall's centre is at (px, 0, pz) and local +z is
   the direction it faces (toward the road). `curb` is the distance from
   the front wall to the kerb, `lotW` the frontage. Returns { group, plates }. */
function buildHouse(parent, spec) {
  const { px, pz, facing, lotW, curb, seed, value, mask, styleHint = {} } = spec;
  const r = rng(seed);
  const g = new THREE.Group();
  g.position.set(px, 0, pz);
  g.rotation.y = Math.atan2(facing.x, facing.z);
  parent.add(g);

  const storeys = styleHint.storeys ?? (r() < 0.45 ? 2 : 1);
  const bodyH = storeys === 2 ? 5.9 : 3.3;
  const garage = styleHint.garage ?? (lotW >= 13.5 && r() < 0.6);
  const gW = garage ? 3.6 : 0;
  const w = Math.min(10, lotW - 3.6 - gW);
  const gableX = r() < 0.5;                 // ridge along the street (side gable) or toward it
  const siding = COLOR.siding[Math.floor(r() * COLOR.siding.length)];
  const roofC = COLOR.roof[Math.floor(r() * COLOR.roof.length)];
  const doorC = COLOR.door[Math.floor(r() * COLOR.door.length)];
  const doorSide = r() < 0.5 ? -1 : 1;      // door left or right of centre
  const bodyX = garage ? -gW / 2 * (doorSide) * 0 : 0;

  // lawn for the whole lot, a shade per lot so the frontage reads
  if (styleHint.lawn !== false) {
    const lawn = slab(g, lotW - 0.4, curb - 0.2 + HOUSE_D + 6, COLOR.lawn[seed % 3], 0, 0.005, (curb - 0.2 - HOUSE_D - 6) / 2);
    lawn.userData.lawn = true;
  }

  // walls
  box(g, w, bodyH, HOUSE_D, siding, bodyX, bodyH / 2, -HOUSE_D / 2);
  // foundation line
  box(g, w + 0.1, 0.35, HOUSE_D + 0.1, 0x8f8a80, bodyX, 0.17, -HOUSE_D / 2);

  // roof
  const ov = 0.55, roofH = gableX ? 2.2 : 2.6;
  const roofM = mat(roofC, { roughness: 0.8 });
  let roof;
  if (gableX) {                                  // ridge along local x (parallel to the street)
    const sh = new THREE.Shape();
    sh.moveTo(-HOUSE_D / 2 - ov, 0); sh.lineTo(HOUSE_D / 2 + ov, 0); sh.lineTo(0, roofH); sh.closePath();
    roof = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: w + 2 * ov, bevelEnabled: false }), roofM);
    roof.rotation.y = -Math.PI / 2;
    roof.position.set(bodyX + w / 2 + ov, bodyH, -HOUSE_D / 2);
  } else {                                       // ridge toward the street: the gable faces the road
    const sh = new THREE.Shape();
    sh.moveTo(-w / 2 - ov, 0); sh.lineTo(w / 2 + ov, 0); sh.lineTo(0, roofH); sh.closePath();
    roof = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: HOUSE_D + 2 * ov, bevelEnabled: false }), roofM);
    roof.position.set(bodyX, bodyH, -HOUSE_D - ov);
    // gable wall in siding colour so the triangle isn't roof-coloured
    const tri = new THREE.Shape();
    tri.moveTo(-w / 2, 0); tri.lineTo(w / 2, 0); tri.lineTo(0, roofH * (w / (w + 2 * ov)));
    const gable = new THREE.Mesh(new THREE.ShapeGeometry(tri), mat(siding));
    gable.position.set(bodyX, bodyH, 0.01); g.add(gable);
  }
  roof.castShadow = true; roof.receiveShadow = true; g.add(roof);

  // door + frame + step, on the door side of the front
  const dx = bodyX + doorSide * (w / 2 - 1.6);
  box(g, 1.3, 2.3, 0.08, COLOR.trim, dx, 1.15, 0.04);
  box(g, 1.02, 2.1, 0.1, doorC, dx, 1.05, 0.07, { roughness: 0.6 });
  box(g, 1.7, 0.16, 0.9, 0xb9b3a8, dx, 0.08, 0.5);
  if (r() < 0.55) {                              // small porch roof on posts, above the number plate
    box(g, 2.6, 0.14, 1.3, roofC, dx, 3.05, 0.65);
    for (const e of [-1, 1]) box(g, 0.12, 3.0, 0.12, COLOR.trim, dx + e * 1.2, 1.5, 1.2);
  }
  // windows: one beside the door, more on the other half, and upstairs
  const win = (wx, wy, ww = 1.3, wh = 1.4) => {
    box(g, ww + 0.2, wh + 0.2, 0.06, COLOR.trim, wx, wy, 0.03);
    box(g, ww, wh, 0.05, COLOR.glass, wx, wy, 0.06, { roughness: 0.25, metalness: 0.15 });
  };
  const farX = bodyX - doorSide * (w / 2 - 2.0);
  win(farX, 1.55, 1.6, 1.4);
  if (w >= 8.5) win(bodyX - doorSide * 0.4, 1.55, 1.2, 1.3);
  if (storeys === 2) { win(farX, 4.45); win(dx, 4.45); if (w >= 8.5) win(bodyX - doorSide * 0.4, 4.45, 1.2, 1.3); }

  // garage beside the house (on the side away from the door), with a driveway to the kerb
  if (garage) {
    const gx = bodyX - doorSide * (w / 2 + gW / 2);
    box(g, gW, 2.9, HOUSE_D - 1.5, siding, gx, 1.45, -(HOUSE_D - 1.5) / 2 - 0.4);
    box(g, gW + 0.3, 0.3, HOUSE_D - 1.2, roofC, gx, 3.0, -(HOUSE_D - 1.2) / 2 - 0.4, { roughness: 0.8 });
    box(g, gW - 0.6, 2.3, 0.08, COLOR.garage, gx, 1.2, -0.36, { roughness: 0.7 });
    slab(g, 3.2, curb - 0.3, COLOR.drive, gx, 0.02, (curb - 0.3) / 2 - 0.2);
  } else {
    // a path from the door to the sidewalk
    slab(g, 1.2, curb - WALK_W - 0.4, COLOR.walk, dx, 0.02, (curb - WALK_W - 0.4) / 2 + 0.6);
  }

  // the number: a plate over the door, and on the mailbox at the kerb
  const shown = mask === null ? String(value) : mask;
  const plateOpts = mask === null ? {} : { fg: BLANK_FG };
  const plate = label(g, shown, PLATE_W, PLATE_H, plateOpts);
  plate.position.set(dx, 2.64, 0.1);
  const mbx = dx + doorSide * 2.2;
  box(g, 0.1, 1.05, 0.1, COLOR.post, mbx, 0.52, curb - 0.45);
  box(g, 0.34, 0.3, 0.58, COLOR.mailbox, mbx, 1.2, curb - 0.45, { roughness: 0.55, metalness: 0.3 });
  const mbPlate = label(g, shown, MB_PLATE_W, MB_PLATE_H, plateOpts);
  mbPlate.position.set(mbx, 1.2, curb - 0.45 + 0.3);

  // greenery
  if (r() < 0.7) buildTree(g, bodyX - doorSide * (w / 2 + (garage ? gW : 0) + 1.2), curb - 2.6 - r() * 2, r);
  if (r() < 0.5) buildShrubs(g, farX - 1.4, farX + 1.4, 0.75, r);

  return { group: g, plates: [plate, mbPlate] };
}

/* ---- walking chevrons: a flat arrow on the road that takes you to the
   next viewpoint (Street View's arrows). A bigger invisible disc catches
   the tap. Pooled: repositioned whenever the viewer moves. ---- */
function chevronShape() {
  const s = new THREE.Shape();
  s.moveTo(0, 1.1); s.lineTo(0.95, -0.35); s.lineTo(0.42, -0.35); s.lineTo(0.42, -1.1);
  s.lineTo(-0.42, -1.1); s.lineTo(-0.42, -0.35); s.lineTo(-0.95, -0.35); s.closePath();
  return s;
}
const CHEV_GEO = new THREE.ShapeGeometry(chevronShape());
const CHEV_HIT = new THREE.CircleGeometry(1.7, 20);
function makeChevron(parent) {
  const g = new THREE.Group();
  const m = new THREE.Mesh(CHEV_GEO, new THREE.MeshBasicMaterial({ color: COLOR.chevron, transparent: true, opacity: 0.82, depthWrite: false, fog: false, side: THREE.DoubleSide }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.05; m.renderOrder = 2;
  const halo = new THREE.Mesh(new THREE.RingGeometry(1.25, 1.5, 28), new THREE.MeshBasicMaterial({ color: COLOR.chevron, transparent: true, opacity: 0.3, depthWrite: false, fog: false }));
  halo.rotation.x = -Math.PI / 2; halo.position.y = 0.04; halo.renderOrder = 1;
  const hit = new THREE.Mesh(CHEV_HIT, new THREE.MeshBasicMaterial({ visible: false }));
  hit.rotation.x = -Math.PI / 2; hit.position.y = 0.06;
  g.add(m, halo, hit);
  g.userData = { arrow: m, halo, hit };
  hit.userData.chevron = g;
  parent.add(g);
  return g;
}

/* ============================================================
   layouts: where the houses, roads and viewpoints go
   ============================================================ */
/* a yaw (camera.rotation.y) that looks along the world direction (dx, dz) */
const yawTo = (dx, dz) => Math.atan2(-dx, -dz);
const YAW_EAST = yawTo(1, 0), YAW_NORTH = yawTo(0, -1);

/* numbers for one side of a block: explicit lists (Part 4) or 2i+1 / 2i+2 */
function numbersFor(b, side, oddSide) {
  if (b.left && b.right) return side < 0 ? b.left : b.right;
  const odd = side === oddSide;
  return Array.from({ length: b.n }, (_, i) => b.hundred * 100 + (odd ? 2 * i + 1 : 2 * i + 2));
}
const maskOf = (st, v) => (st.blanks && st.blanks[v] !== undefined ? st.blanks[v] : null);

/* a straight street along x: cross street, block, cross street, block ...
   Houses on the left (z < 0) face +z; on the right they face -z. Lot widths
   follow the number steps, so a bigger jump in the numbers is a wider lot. */
function layoutStreet(st) {
  const houses = [], nodes = [], blocks = [], crossings = [];
  const oddSide = st.odd === 'right' ? 1 : -1;
  let x = 0;
  st.blocks.forEach((b, bi) => {
    const lowName = crossName(b.hundred - 1);
    crossings.push({ x0: x, x1: x + CROSS_W, name: lowName, blockAhead: b.hundred * 100,
      blockBehind: bi > 0 ? st.blocks[bi - 1].hundred * 100 : null, index: bi });
    nodes.push({ x: x + CROSS_W / 2, z: 0, kind: 'cross', at: lowName, heading: YAW_EAST });
    const x0 = x + CROSS_W;
    const nums = { [-1]: numbersFor(b, -1, oddSide), [1]: numbersFor(b, 1, oddSide) };
    const n = Math.max(nums[-1].length, nums[1].length);
    const L = n * LOT_W;
    for (const s of [-1, 1]) {
      const list = nums[s];
      const steps = list.map((v, i) => i < list.length - 1 ? list[i + 1] - v : (list.length > 1 ? list[i] - list[i - 1] : 2));
      const tot = steps.reduce((a, c) => a + c, 0);
      let lx = x0;
      list.forEach((v, i) => {
        const w = L * steps[i] / tot;
        houses.push({
          value: v, mask: maskOf(st, v), side: s, x0: lx, x1: lx + w, hundred: b.hundred, block: bi, index: i,
          px: lx + w / 2, pz: s * FRONT_Z, facing: { x: 0, z: -s }, lotW: w, curb: FRONT_Z - HALF_ROAD,
          desc: `${ordinal(i + 1)} house on the ${s < 0 ? 'left' : 'right'}` +
                (st.blocks.length > 1 ? ` in the ${b.hundred * 100} block` : ''),
        });
        lx += w;
      });
    }
    const nN = Math.max(1, Math.round(L / NODE_STEP));
    for (let k = 0; k < nN; k++) {
      const nx = x0 + (k + 0.5) * L / nN;
      nodes.push({ x: nx, z: 0, kind: 'block', hundred: b.hundred, heading: YAW_EAST });
    }
    blocks.push({ x0, x1: x0 + L, hundred: b.hundred, index: bi });
    x = x0 + L;
  });
  const last = st.blocks[st.blocks.length - 1];
  const highName = crossName(last.hundred);
  crossings.push({ x0: x, x1: x + CROSS_W, name: highName, blockAhead: null, blockBehind: last.hundred * 100, index: st.blocks.length });
  nodes.push({ x: x + CROSS_W / 2, z: 0, kind: 'cross', at: highName, heading: YAW_EAST });
  nodes.forEach((nd, i) => {
    nd.links = [];
    if (i > 0) nd.links.push(i - 1);
    if (i < nodes.length - 1) nd.links.push(i + 1);
  });
  // where each viewpoint stands, for the spoken status: "between 204 and 206"
  for (const nd of nodes) nd.near = nearestHouses(nd, houses);
  const start = st.startNode === 'far' ? nodes.length - 1 : st.startNode === 'mid' ? Math.floor(nodes.length / 2) : 0;
  if (st.startNode === 'far') nodes[start].startHeading = yawTo(-1, 0);
  return { kind: 'street', houses, nodes, blocks, crossings, oddSide, start,
    xMin: 0, xMax: x + CROSS_W, bounds: { x0: -8, x1: x + CROSS_W + 8, z0: -26, z1: 26 } };
}

/* the two houses (one per side) nearest a viewpoint */
function nearestHouses(nd, houses) {
  const out = [];
  for (const s of [-1, 1]) {
    let best = null, bd = Infinity;
    for (const h of houses) {
      if ((h.side || 0) !== s) continue;
      const d = Math.hypot(h.px - nd.x, h.pz - nd.z);
      if (d < bd) { bd = d; best = h; }
    }
    if (best && bd < 16) out.push(best);
  }
  return out;
}

/* a court: a short stretch of the main street with the court opening off
   its north side, two lots either side of the entrance, then a bulb with
   three houses on each half. `left` / `right` list each side's numbers in
   walking-in order (entrance first, then round the bulb). */
function layoutCourt(st) {
  const houses = [], nodes = [];
  const m = st.main;
  CT.mainLots.forEach(([x0, x1], i) => {
    for (const [s, list] of [[-1, m.north], [1, m.south]]) {
      houses.push({ value: list[i], mask: null, main: true, side: s, x0, x1,
        px: (x0 + x1) / 2, pz: s * FRONT_Z, facing: { x: 0, z: -s }, lotW: x1 - x0, curb: FRONT_Z - HALF_ROAD,
        desc: `on ${m.name}` });
    }
  });
  for (const [key, sx] of [['left', -1], ['right', 1]]) {
    const list = st[key];
    CT.entryLots.forEach(([z0, z1], i) => {
      const v = list[i];
      houses.push({ value: v, mask: maskOf(st, v), courtSide: key, order: i, side: sx,
        px: sx * FRONT_Z, pz: (z0 + z1) / 2, facing: { x: -sx, z: 0 }, lotW: z0 - z1, curb: FRONT_Z - HALF_ROAD,
        desc: `${ordinal(i + 1)} house on the ${key} going in` });
    });
    CT.leftPhi.forEach((deg, i) => {
      const phi = (sx < 0 ? deg : 360 - deg) * Math.PI / 180;
      const v = list[CT.entryLots.length + i];
      const px = -CT.houseR * Math.sin(phi), pz = CT.bulbZ + CT.houseR * Math.cos(phi);
      const fx = -px, fz = CT.bulbZ - pz, fl = Math.hypot(fx, fz);
      houses.push({ value: v, mask: maskOf(st, v), courtSide: key, order: CT.entryLots.length + i, side: sx, bulb: true,
        px, pz, facing: { x: fx / fl, z: fz / fl }, lotW: 12.5, curb: CT.houseR - CT.bulbR, noLawn: true,
        desc: `${ordinal(i + 1)} house round the bulb on the ${key}` });
    });
  }
  const mainX = [-28, -14, 0, 14, 28];
  mainX.forEach(x => nodes.push({ x, z: 0, kind: 'main', heading: YAW_EAST }));
  const MOUTH = 2;
  nodes[MOUTH].heading = YAW_NORTH;
  const entryZ = [-14, -27, -40];
  const E0 = nodes.length;
  entryZ.forEach(z => nodes.push({ x: 0, z, kind: 'entry', heading: YAW_NORTH }));
  const R0 = nodes.length;
  const ringDeg = [0, 60, 120, 180, 240, 300];
  ringDeg.forEach(deg => {
    const phi = deg * Math.PI / 180;
    nodes.push({ x: -CT.ringR * Math.sin(phi), z: CT.bulbZ + CT.ringR * Math.cos(phi), kind: 'ring', deg });
  });
  nodes.forEach(nd => nd.links = []);
  const link = (a, b) => { nodes[a].links.push(b); nodes[b].links.push(a); };
  for (let i = 0; i < mainX.length - 1; i++) link(i, i + 1);
  link(MOUTH, E0);
  for (let i = 0; i < entryZ.length - 1; i++) link(E0 + i, E0 + i + 1);
  link(E0 + entryZ.length - 1, R0);
  for (let i = 0; i < ringDeg.length; i++) link(R0 + i, R0 + (i + 1) % ringDeg.length);
  // ring viewpoints face the way the left side counts: round via the west
  for (let i = 0; i < ringDeg.length; i++) {
    const a = nodes[R0 + i], b = nodes[R0 + (i + 1) % ringDeg.length];
    a.heading = yawTo(b.x - a.x, b.z - a.z);
  }
  for (const nd of nodes) nd.near = nd.kind === 'main' ? nearestHouses(nd, houses.filter(h => h.main))
    : houses.filter(h => !h.main && Math.hypot(h.px - nd.x, h.pz - nd.z) < 15).slice(0, 2);
  return { kind: 'court', houses, nodes, start: MOUTH, mouth: MOUTH, ring0: R0,
    bounds: { x0: -36, x1: 36, z0: -84, z1: 22 } };
}

  // one court that counts round in a single run: 1, 2, 3 ... up one side, back down the other
  { part: 5, type: 'loop', kind: 'quiz', label: 'Fern Ct',
    main: { name: 'Pine St', north: [2202, 2204, 2206, 2208], south: [2201, 2203, 2205, 2207] },
    left: [1, 2, 3, 4, 5], right: [10, 9, 8, 7, 6],
    blanks: { 3: '?', 5: '?', 7: '?', 8: '?', 10: '?' } },
];

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* the nearest numbers shown from the start on the same side of the same
   block, below and above this house (null when there is none) */
function shownNeighbours(house, layout) {
  let lo = null, hi = null;
  for (const h of layout.houses) {
    if (h === house || h.mask !== null || h.main) continue;
    const sameRun = layout.kind === 'court' ? h.courtSide === house.courtSide
      : (h.side === house.side && h.block === house.block);
    if (!sameRun) continue;
    if (h.value < house.value && (lo === null || h.value > lo)) lo = h.value;
    if (h.value > house.value && (hi === null || h.value < hi)) hi = h.value;
  }
  return { lo, hi };
}

/* three wrong answers that each break exactly one rule the part teaches:
   the other side (parity), the wrong hundred, the wrong spot along the block.
   For the gap streets the "wrong spot" lies outside the visible neighbours,
   since any same-parity number between them would fit the pattern. */
function makeOptionsFor(house, st, layout) {
  const v = house.value, out = [];
  const pick = cands => {
    const c = shuffle(cands.filter(n => Number.isFinite(n) && n > 0 && n !== v && !out.includes(n)));
    if (c.length) { out.push(c[0]); return true; }
    return false;
  };
  if (st.type === 'loop') {
    const N = st.left.length + st.right.length;
    const ok = n => n >= 1 && n <= N;
    pick([v - 2, v + 2].filter(ok));
    pick([v - 3, v + 3].filter(ok));
    pick([v - 4, v + 4, v - 5, v + 5].filter(ok));
    let k = 1;
    while (out.length < 3 && k <= N) pick([k++]);
  } else if (st.type === 'street') {
    pick([v - 1, v + 1]);
    pick([v - 2, v + 2]);
    pick([v - 4, v + 4, v - 10, v + 10, v - 6, v + 6]);
  } else if (st.gaps) {
    pick([v - 1, v + 1]);
    pick([v - 100, v + 100]);
    const { lo, hi } = shownNeighbours(house, layout);
    const inBlock = n => Math.floor(n / 100) === Math.floor(v / 100) && n % 100 > 0;
    const cands = [];
    if (lo !== null) cands.push(lo - 2, lo - 4); else cands.push(v - 12, v - 20);
    if (hi !== null) cands.push(hi + 2, hi + 4); else cands.push(v + 12, v + 20);
    pick(cands.filter(inBlock));
    if (out.length < 3) pick([v - 20, v + 20, v + 30, v - 30].filter(inBlock));
  } else {                                           // block, court
    pick([v - 1, v + 1]);
    pick([v - 100, v + 100].filter(n => n >= 100));
    pick([v - 2, v + 2, v - 4, v + 4, v - 20, v + 20]);
  }
  while (out.length < 3) pick([v + 3, v - 3, v + 5, v - 5, v + 7, v + 9]);
  return shuffle([v, ...out.slice(0, 3)]);
}

/* ============================================================
   building a stage
   ============================================================ */
/* kerb + sidewalk strips along x on both sides (or one) of the main road */
function buildWalks(g, x0, x1, sides = [-1, 1]) {
  const len = x1 - x0, cx = (x0 + x1) / 2;
  for (const s of sides) {
    box(g, len, 0.14, 0.32, COLOR.kerb, cx, 0.07, s * (HALF_ROAD + 0.16));
    slab(g, len, WALK_W - 0.32, COLOR.walk, cx, 0.13, s * (HALF_ROAD + 0.32 + (WALK_W - 0.32) / 2));
  }
}
/* a road along z (the court entrance): x centred on 0 */
function buildRoadZ(g, z0, z1, { walks = true } = {}) {
  const len = Math.abs(z1 - z0), cz = (z0 + z1) / 2;
  const r = slab(g, HALF_ROAD * 2, len, COLOR.road, 0, 0.0, cz);
  r.material = roadMat(); r.material.map.repeat.set(2, len / 6);
  if (!walks) return;
  for (const s of [-1, 1]) {
    box(g, 0.32, 0.14, len, COLOR.kerb, s * (HALF_ROAD + 0.16), 0.07, cz);
    slab(g, WALK_W - 0.32, len, COLOR.walk, s * (HALF_ROAD + 0.32 + (WALK_W - 0.32) / 2), 0.13, cz);
  }
}

/* the coloured "12 · 05  BLOCK · LOT" key, drawn on its own canvas */
function placeKeyTexture(segments) {
  const CW = 1024, CH = 300;
  const c = document.createElement('canvas'); c.width = CW; c.height = CH;
  const ctx = c.getContext('2d');
  const r = 28;
  ctx.fillStyle = 'rgba(20,24,30,0.92)';
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(CW - r, 0); ctx.quadraticCurveTo(CW, 0, CW, r);
  ctx.lineTo(CW, CH - r); ctx.quadraticCurveTo(CW, CH, CW - r, CH);
  ctx.lineTo(r, CH); ctx.quadraticCurveTo(0, CH, 0, CH - r);
  ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath(); ctx.fill();
  const digitFont = `bold 170px ${PLATE_FONT}`, capFont = `bold 50px ${PLATE_FONT}`;
  const gap = 46;
  const cols = segments.map(([text, place]) => {
    ctx.font = digitFont; const dw = ctx.measureText(text).width;
    ctx.font = capFont; const cw = ctx.measureText(place.toUpperCase()).width;
    return { text, place, w: Math.max(dw, cw) };
  });
  let total = 0;
  cols.forEach((col, i) => { total += col.w + (i ? gap : 0); });
  let cx = (CW - total) / 2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  cols.forEach((col, i) => {
    const mid = cx + col.w / 2;
    ctx.fillStyle = PLACE_COLORS[col.place] || PLACE_COLORS.lot;
    ctx.font = digitFont; ctx.fillText(col.text, mid, 112);
    ctx.font = capFont; ctx.fillText(col.place.toUpperCase(), mid, 228);
    if (i) { ctx.fillStyle = '#9fb0c0'; ctx.font = digitFont; ctx.fillText('·', cx - gap / 2, 108); }
    cx += col.w + gap;
  });
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 8; tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
/* a sign on a post; the plane faces local +z, yaw turns it */
function addPost(g, x, z, h) { box(g, 0.12, h, 0.12, COLOR.post, x, h / 2, z); }
function addPlaceKey(g, segments, x, y, z, yaw) {
  const grp = new THREE.Group();
  const tex = placeKeyTexture(segments);
  for (const s of [1, -1]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 1.3), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    m.rotation.y = s > 0 ? 0 : Math.PI; m.position.z = s * 0.006;
    grp.add(m);
  }
  grp.position.set(x, y, z); grp.rotation.y = yaw;
  g.add(grp);
  addPost(g, x, z, y - 0.65);
  return grp;
}
function addBoard(g, lines, x, y, z, yaw, pw = 4.4, ph = 1.4, opts = {}) {
  addPost(g, x, z, y - ph / 2);
  return board(g, lines, pw, ph, x, y, z, yaw, opts);
}

/* the straight-street scene: roads, walks, signs, cars, and the guides on an example */
function buildStreetScene(g, st, L, seed) {
  const r = rng(seed ^ 0x9e3779b9);
  for (const b of L.blocks) { buildRoad(g, b.x0, b.x1); buildWalks(g, b.x0, b.x1); }
  for (const c of L.crossings) buildCrossStreet(g, c.x0, c.x1);
  buildRoad(g, L.xMin - 60, L.xMin); buildWalks(g, L.xMin - 60, L.xMin);
  buildRoad(g, L.xMax, L.xMax + 60); buildWalks(g, L.xMax, L.xMax + 60);
  for (const c of L.crossings) {
    buildSignPole(g, c.x1 + 0.9, -(HALF_ROAD + 0.9), st.label, c.name, c.blockAhead);
    buildSignPole(g, c.x0 - 0.9, HALF_ROAD + 0.9, st.label, c.name, c.blockBehind);
  }
  // a few parked cars at the kerb, never in front of a blank house's mailbox view
  for (const b of L.blocks) {
    const n = Math.round((b.x1 - b.x0) / 30);
    for (let i = 0; i < n; i++) {
      const x = b.x0 + 6 + r() * (b.x1 - b.x0 - 12), s = r() < 0.5 ? -1 : 1;
      const blocked = L.houses.some(h => h.mask !== null && h.side === s && Math.abs(h.px - x) < 9);
      if (blocked) continue;
      buildCar(g, x, s * 2.5, s < 0 ? 0 : Math.PI, COLOR.car[Math.floor(r() * COLOR.car.length)]);
    }
  }
  // trees along the stubs beyond the course so the street doesn't end abruptly
  for (const x of [L.xMin - 14, L.xMin - 30, L.xMin - 48, L.xMax + 14, L.xMax + 30, L.xMax + 48])
    for (const s of [-1, 1]) buildTree(g, x + r() * 4, s * (7 + r() * 8), r);

  if (st.kind !== 'example') return;
  const b0 = L.blocks[0], mid = (b0.x0 + b0.x1) / 2;
  if (st.part === 1) {
    for (const s of [-1, 1]) {
      const odd = s === L.oddSide;
      const nums = L.houses.filter(h => h.side === s).map(h => h.value);
      addBoard(g, [odd ? 'ODD SIDE' : 'EVEN SIDE', nums.slice(0, 3).join(' · ') + ' …'],
        mid, 3.4, s * (HALF_ROAD + WALK_W + 0.9), s < 0 ? 0 : Math.PI, 4.0, 1.2,
        { accent: PLACE_COLORS.side });
    }
  }
  if (st.part === 2) {
    addBoard(g, ['MAIN ST', 'numbers start here'], b0.x0 + 0.6, 3.1, -(HALF_ROAD + WALK_W + 0.9), -Math.PI / 2, 4.4, 1.4);
    for (const s of [-1, 1]) {
      const z = s * (HALF_ROAD + WALK_W + 0.6);
      for (let k = 0; k < 3; k++) {
        const x = b0.x0 + 10 + k * 24;
        arrow(g, new THREE.Vector3(x, 0.6, z), new THREE.Vector3(x + 7, 0.6, z), COLOR.arrow, 0.11);
      }
    }
    addBoard(g, ['NUMBERS RISE', 'away from Main St →'], mid, 3.3, -(HALF_ROAD + WALK_W + 0.9), 0, 4.6, 1.4);
  }
  if (st.part === 3) {
    addPlaceKey(g, [['2', 'block'], ['05', 'lot']], L.blocks[1].x0 + 0.6, 3.0, -(HALF_ROAD + WALK_W + 0.9), -Math.PI / 2);
    for (const c of L.crossings.slice(1, -1))
      addBoard(g, ['+100', `the ${c.blockAhead} block`], (c.x0 + c.x1) / 2, 4.8, -(HALF_ROAD - 0.6), -Math.PI / 2, 3.4, 1.2);
  }
  if (st.part === 4) {
    addPlaceKey(g, [['14', 'block'], ['02', 'lot']], b0.x0 + 0.6, 3.0, -(HALF_ROAD + WALK_W + 0.9), -Math.PI / 2);
    const rightNums = L.houses.filter(h => h.side === 1 && h.block === 0).map(h => h.value);
    addBoard(g, ['GAPS ARE NORMAL', rightNums.join(' · ')], mid, 3.3, HALF_ROAD + WALK_W + 0.9, Math.PI, 5.2, 1.4);
    addBoard(g, ['A WIDER LOT', 'a bigger jump'], mid + 6, 3.3, -(HALF_ROAD + WALK_W + 0.9), 0, 4.2, 1.3);
  }
}

/* the court scene */
function buildCourtScene(g, st, L, seed) {
  const r = rng(seed ^ 0x51ed27);
  buildRoad(g, -60, 60);
  buildWalks(g, -60, -(HALF_ROAD + WALK_W), [-1]);
  buildWalks(g, HALF_ROAD + WALK_W, 60, [-1]);
  buildWalks(g, -60, 60, [1]);
  const zEnd = CT.bulbZ + Math.sqrt(CT.bulbR * CT.bulbR - HALF_ROAD * HALF_ROAD);
  buildRoadZ(g, -HALF_ROAD, zEnd, { walks: false });
  // entrance walks, from the corner of the main street's sidewalk to the bulb ring
  const zTan = CT.bulbZ + Math.sqrt(Math.pow(CT.bulbR + WALK_W, 2) - Math.pow(HALF_ROAD + WALK_W, 2));
  for (const s of [-1, 1]) {
    const z0 = -(HALF_ROAD + WALK_W), len = z0 - zTan;
    box(g, 0.32, 0.14, len, COLOR.kerb, s * (HALF_ROAD + 0.16), 0.07, z0 - len / 2);
    slab(g, WALK_W - 0.32, len, COLOR.walk, s * (HALF_ROAD + 0.32 + (WALK_W - 0.32) / 2), 0.13, z0 - len / 2);
  }
  // the bulb: asphalt disc, kerb ring, sidewalk ring, and lawn all round
  const disc = new THREE.Mesh(new THREE.CircleGeometry(CT.bulbR, 48), roadMat());
  disc.rotation.x = -Math.PI / 2; disc.position.set(0, 0.006, CT.bulbZ); disc.receiveShadow = true; g.add(disc);
  const ring = (r0, r1, y, color) => {
    const m = new THREE.Mesh(new THREE.RingGeometry(r0, r1, 56), mat(color, { roughness: 1 }));
    m.rotation.x = -Math.PI / 2; m.position.set(0, y, CT.bulbZ); m.receiveShadow = true; g.add(m); return m;
  };
  ring(CT.bulbR, CT.bulbR + 0.32, 0.14, COLOR.kerb);
  ring(CT.bulbR + 0.32, CT.bulbR + WALK_W, 0.13, COLOR.walk);
  ring(CT.bulbR + WALK_W, CT.bulbR + WALK_W + 24, 0.008, COLOR.lawn[1]);
  // lawns for the entrance lots, one slab per side
  for (const s of [-1, 1]) {
    const z0 = CT.entryLots[0][0], z1 = CT.entryLots[CT.entryLots.length - 1][1];
    slab(g, 16, z0 - z1 + 4, COLOR.lawn[0], s * (HALF_ROAD + WALK_W + 8), 0.006, (z0 + z1) / 2 - 2);
  }
  // signs at the mouth: the court's name reads from the main street
  buildSignPole(g, HALF_ROAD + WALK_W + 0.9, -(HALF_ROAD + 0.9), st.main.name, st.label, null);
  buildSignPole(g, -(HALF_ROAD + WALK_W + 0.9), -(HALF_ROAD + 0.9), st.main.name, st.label, null);
  addBoard(g, ['NO OUTLET'], HALF_ROAD + WALK_W + 1.0, 2.1, -(HALF_ROAD + WALK_W + 2.2), 0, 2.0, 0.9,
    { bg: '#f2c230', fg: '#1a1400', accent: '#1a1400', size: 110 });
  // a couple of parked cars on the main street
  buildCar(g, -22, 2.5, Math.PI, COLOR.car[0]);
  buildCar(g, 24, -2.5, 0, COLOR.car[2]);
  buildCar(g, 6.4, -30, Math.PI / 2, COLOR.car[4]);
  for (const x of [-44, -52, 44, 52]) for (const s of [-1, 1]) buildTree(g, x + r() * 4, s * (7 + r() * 8), r);
  buildTree(g, 0, CT.bulbZ - CT.houseR - 12, r);   // behind the houses at the top of the bulb
  if (st.kind !== 'example') return;
  addBoard(g, ['ROUND THE COURT', 'odd left · even right', 'the sides meet at the far end'],
    -(HALF_ROAD + WALK_W + 1.2), 3.6, -17, Math.PI / 2, 5.0, 1.75, { size: 84 });
  // arrows along both sidewalks going in, and round the bulb
  for (const s of [-1, 1]) {
    const x = s * (HALF_ROAD + WALK_W + 0.6);
    for (const z of [-12, -30]) arrow(g, new THREE.Vector3(x, 0.6, z), new THREE.Vector3(x, 0.6, z - 7), COLOR.arrow, 0.11);
    for (const deg of [35, 85, 135]) {
      const a0 = (s < 0 ? deg : 360 - deg) * Math.PI / 180, a1 = a0 + (s < 0 ? 1 : -1) * 0.34;
      const rr = CT.bulbR + WALK_W + 0.6;
      arrow(g, new THREE.Vector3(-rr * Math.sin(a0), 0.6, CT.bulbZ + rr * Math.cos(a0)),
               new THREE.Vector3(-rr * Math.sin(a1), 0.6, CT.bulbZ + rr * Math.cos(a1)), COLOR.arrow, 0.11);
    }
  }
}

function buildStageGroup(i) {
  const st = STAGES[i];
  const g = new THREE.Group();
  scene.add(g);
  const layout = (st.type === 'court' || st.type === 'loop') ? layoutCourt(st) : layoutStreet(st);
  const seed = hashStr(st.label);
  if (layout.kind === 'street') buildStreetScene(g, st, layout, seed);
  else buildCourtScene(g, st, layout, seed);

  const raycastList = [], blankStates = [];
  layout.houses.forEach((h, k) => {
    const built = buildHouse(g, {
      px: h.px, pz: h.pz, facing: h.facing, lotW: h.lotW, curb: h.curb,
      seed: (seed + k * 7919 + h.value * 31) >>> 0, value: h.value, mask: h.mask,
      styleHint: h.noLawn ? { lawn: false } : {},
    });
    h.plates = built.plates; h.group = built.group;
    if (h.mask === null) return;
    const bstate = { value: h.value, solved: false, plate: built.plates[0], plates: built.plates,
      options: makeOptionsFor(h, st, layout), house: h };
    built.group.traverse(o => {
      if (!o.isMesh || o.userData.lawn) return;
      o.userData.bstate = bstate;
      raycastList.push(o);
    });
    blankStates.push(bstate);
  });
  const chevrons = [0, 1, 2, 3].map(() => makeChevron(g));
  g.userData = { raycastList, blankStates, layout, chevrons, st, node: layout.start };
  return g;
}

/* ============================================================
   the Street View camera: stand at a viewpoint, drag to look round,
   scroll / pinch to zoom, walk to the next viewpoint
   ============================================================ */
const look = { yaw: YAW_EAST, pitch: 0, fov: 62, vyaw: 0, vpitch: 0 };
const FOV_MIN = 22, FOV_MAX = 80;
const PITCH_MIN = -0.62, PITCH_MAX = 0.85;
const fovDefault = () => (camera.aspect < 1 ? 74 : 62);
const TAU = Math.PI * 2;
const wrapAngle = a => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
function applyLook() {
  look.pitch = THREE.MathUtils.clamp(look.pitch, PITCH_MIN, PITCH_MAX);
  look.fov = THREE.MathUtils.clamp(look.fov, FOV_MIN, FOV_MAX);
  camera.rotation.set(look.pitch, look.yaw, 0);
  if (camera.fov !== look.fov) { camera.fov = look.fov; camera.updateProjectionMatrix(); }
}
const forwardXZ = () => ({ x: -Math.sin(look.yaw), z: -Math.cos(look.yaw) });

/* eased turns and zooms on their own loop; a drag cancels them */
let lookRAF = 0, lookSeq = 0;
function easeLook(target, ms) {
  lookSeq++; const seq = lookSeq;
  if (lookRAF) { cancelAnimationFrame(lookRAF); lookRAF = 0; }
  look.vyaw = look.vpitch = 0;
  const from = { yaw: look.yaw, pitch: look.pitch, fov: look.fov };
  const to = { yaw: target.yaw ?? look.yaw, pitch: target.pitch ?? look.pitch, fov: target.fov ?? look.fov };
  const dyaw = wrapAngle(to.yaw - from.yaw);
  if (prefersReducedMotion()) ms = 0;
  const land = () => { look.yaw = wrapAngle(from.yaw + dyaw); look.pitch = to.pitch; look.fov = to.fov; lookRAF = 0; applyLook(); updateResetChip(); mmSync(); };
  if (ms <= 0) { land(); return; }
  const t0 = performance.now();
  const step = now => {
    if (seq !== lookSeq) return;
    const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    look.yaw = from.yaw + dyaw * e; look.pitch = from.pitch + (to.pitch - from.pitch) * e; look.fov = from.fov + (to.fov - from.fov) * e;
    applyLook();
    if (k < 1) lookRAF = requestAnimationFrame(step); else land();
  };
  lookRAF = requestAnimationFrame(step);
}
function turnBy(deg, ms = 320) { easeLook({ yaw: look.yaw + THREE.MathUtils.degToRad(deg) }, ms); }

/* ---- walking between viewpoints ---- */
let walking = false, walkRAF = 0, walkSeq = 0;
function walkTo(idx, via = 'ui', ms = 640) {
  const ud = curUD();
  if (!ud) return;
  const nd = ud.layout.nodes[idx];
  if (!nd || idx === ud.node) return;
  walkSeq++; const seq = walkSeq;

/* one-time swing on the very first framing: start 22 degrees off and glide

let firstFrame = true;

  const ud = curUD();
  const nd = ud.layout.nodes[ud.node];

  look.vyaw = look.vpitch = 0;

/* what is under a screen point: a walking arrow, a blank house (its plates
   win over its walls), or a spot on the road near a viewpoint */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

const hitPt = new THREE.Vector3();
function pickAt(clientX, clientY) {
  const ud = curUD();
  if (!ud) return null;
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const discs = ud.chevrons.filter(c => c.visible).map(c => c.userData.hit);
  const ch = raycaster.intersectObjects(discs, false)[0];
  if (ch) return { chevron: ch.object.userData.chevron };

    let body = null;
    for (const h of raycaster.intersectObjects(blanks, false)) {
      const bs = h.object.userData.bstate;
      if (!bs || bs.solved) continue;
      if (bs.plates.includes(h.object)) return { bstate: bs };
      if (!body && h.distance < 40) body = bs;
    }
    if (body) return { bstate: body };
  }
  if (raycaster.ray.intersectPlane(groundPlane, hitPt)) {

/* ============================================================
   street map (top-down): the road, the blocks, every house, the
   viewpoints you can tap, and where you stand and face
   ============================================================ */
const mmBox = document.getElementById('minimap');

    }

        mmNode('text', { x: M.toU((b.x0 + b.x1) / 2, 0), y: M.toV(0, 0) + 3, 'text-anchor': 'middle', fill: '#eef2f6', 'font-size': 8, 'font-weight': 700, 'font-family': 'system-ui, sans-serif' }).textContent = b.hundred * 100;

    mmNode('text', { x: uM + 4, y: M.toV(-28, 0), fill: walk, 'font-size': 7, 'font-family': 'system-ui, sans-serif', transform: `rotate(-90 ${uM + 4} ${M.toV(-28, 0)})` }).textContent = st.main.name;
    mmNode('text', { x: M.toU(0, -9), y: M.toV(-6, 0), fill: walk, 'font-size': 7, 'font-family': 'system-ui, sans-serif' }).textContent = st.label;

}
