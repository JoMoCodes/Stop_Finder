<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stop Finder — prototype</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 70% -10%, #243044, #131820 60%); color: #eef2f6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px;
  }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: .3px; }
  .sub { color: #9fb0c0; margin-bottom: 26px; font-size: 14px; }
  .grid { display: grid; gap: 16px; width: 100%; max-width: 460px; }
  a.card, div.card {
    display: block; text-decoration: none; color: inherit;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 18px 20px; transition: transform .12s ease, background .12s ease;
  }
  a.card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.09); }
  .card h2 { margin: 0; font-size: 17px; }
  .card.soon { opacity: .55; }

  /* a card that fans out its variants on hover (or on focus / tap, for keyboards and phones) */
  .card.group { cursor: default; transition: background .12s ease; }
  .card.group:hover, .card.group:focus-within, .card.group.open { background: rgba(255,255,255,0.09); }
  .card.group h2 .chev { display: inline-block; margin-left: 6px; color: #9fb0c0; font-size: 13px; transition: transform .15s ease; }
  .card.group:hover h2 .chev, .card.group:focus-within h2 .chev, .card.group.open h2 .chev { transform: rotate(90deg); }
  .card.group .opts {
    display: grid; gap: 8px; list-style: none; margin: 0; padding: 0;
    max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height .2s ease, opacity .15s ease, margin .2s ease;
  }
  .card.group:hover .opts, .card.group:focus-within .opts, .card.group.open .opts { max-height: 240px; opacity: 1; margin-top: 12px; }
  .card.group .opts a {
    display: block; text-decoration: none; color: #eef2f6; font-size: 15px;
    padding: 10px 14px; border-radius: 10px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10);
    transition: background .12s ease, transform .12s ease;
  }
  .card.group .opts a:hover { background: rgba(87,201,126,0.22); border-color: rgba(87,201,126,0.4); transform: translateX(3px); }
  .card.group .opts a:focus-visible { outline: 2px solid #ffd54a; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .card, .card .opts, .card .opts a, .card h2 .chev { transition: none; }
  }
  .tag {
    float: right; font-size: 11px; padding: 2px 9px; border-radius: 999px;
    background: rgba(120,200,140,0.18); color: #9be3ad; border: 1px solid rgba(120,200,140,0.3);
  }
  .tag.alt { background: rgba(159,176,192,0.15); color: #c4d0dc; border-color: rgba(159,176,192,0.3); }
  .tag.wip { background: rgba(255,180,120,0.15); color: #ffc89a; border-color: rgba(255,180,120,0.3); }
  .foot { margin-top: 24px; color: #6f8298; font-size: 12px; }
</style>
</head>
<body>
  <h1>Stop Finder</h1>
  <div class="sub">Address-pattern recognition — prototype.</div>

  <div class="grid">
    <div class="card group" id="apartments" tabindex="0" aria-expanded="false">
      <span class="tag">live</span>
      <h2>Apartments <span class="chev" aria-hidden="true">▸</span></h2>
      <ul class="opts" aria-label="Apartment course looks">
        <li><a href="apartment-realistic-a.html">Sunbelt</a></li>
        <li><a href="apartment-realistic-b.html">Brick</a></li>
        <li><a href="apartment-realistic-c.html">Suburban</a></li>
      </ul>
    </div>

    <div class="card soon">
      <span class="tag wip">coming soon</span>
      <h2>2D Address Grid</h2>
    </div>
  </div>

  <div class="foot">Work in progress — pieces are being built and tuned.</div>

  <script>
    // Hover reveals the looks; on touch screens (no hover) a tap on the card toggles them instead.
    const card = document.getElementById('apartments');
    const sync = () => card.setAttribute('aria-expanded', String(card.classList.contains('open') || card.matches(':hover, :focus-within')));
    const noHover = matchMedia('(hover: none)').matches;
    card.addEventListener('click', e => {
      if (e.target.closest('a') || !noHover) return;
      card.classList.toggle('open'); sync();
    });
    card.addEventListener('keydown', e => {
      if (e.target !== card) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.classList.toggle('open'); sync(); }
      if (e.key === 'Escape') { card.classList.remove('open'); sync(); }
    });
    for (const ev of ['mouseenter', 'mouseleave', 'focusin', 'focusout']) card.addEventListener(ev, () => setTimeout(sync, 0));
    document.addEventListener('click', e => { if (!card.contains(e.target)) { card.classList.remove('open'); sync(); } });
  </script>
  <script type="module" src="./track.js"></script>
</body>
</html>
