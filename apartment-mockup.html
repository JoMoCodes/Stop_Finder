  const p = POSES[st && st.type] || POSES.plex;
  const pos = new THREE.Vector3(p.pos[0], p.pos[1], p.pos[2]);
  const tgt = new THREE.Vector3(p.tgt[0], p.tgt[1], p.tgt[2]);
  // portrait: pull straight back along the view ray, keeping the framing
  if (camera.aspect < 1) pos.sub(tgt).multiplyScalar(PORTRAIT_BACKOFF).add(tgt);
  return { pos, tgt };
}

/* portrait phones widen the lens so a 24-wide row still fits across */
function applyViewportFov() {
  const fov = camera.aspect < 1 ? Math.min(74, 50 / Math.sqrt(camera.aspect)) : 50;
  if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
}

/* ---- eased camera moves --------------------------------------------
   Cubic ease-out on its own rAF loop. Controls are disabled while the
   camera is in flight; a new call cancels the one in progress. Under
   reduced motion every move becomes an instant cut. ---- */
let flyRAF = 0, flying = false, flySeq = 0;

function flyTo(pos, tgt, ms = MOVE_MS) {
  flySeq++;
  if (flyRAF) { cancelAnimationFrame(flyRAF); flyRAF = 0; }
  if (prefersReducedMotion()) ms = 0;
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const land = () => {
    flyRAF = 0; flying = false;
    camera.position.copy(pos); controls.target.copy(tgt);
    controls.enabled = true; controls.update();
    updateResetChip();
  };
  if (ms <= 0 || (p0.distanceTo(pos) < 1e-3 && t0.distanceTo(tgt) < 1e-3)) { land(); return; }
  flying = true; controls.enabled = false;
  const t0ms = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - t0ms) / ms);
    const e = 1 - Math.pow(1 - k, 3);          // ease-out, no overshoot
    camera.position.lerpVectors(p0, pos, e);
    controls.target.lerpVectors(t0, tgt, e);
    controls.update();
    if (k < 1) flyRAF = requestAnimationFrame(step);
    else land();
  };
  flyRAF = requestAnimationFrame(step);
}

/* one-time swing on the very first framing: start 18 degrees off the
   resting pose and glide in, so "the building rotates" is shown, not told */
let introRunning = false;
function introSwing(pos, tgt) {
  if (prefersReducedMotion()) { flyTo(pos, tgt, 0); return; }
  const sph = new THREE.Spherical().setFromVector3(pos.clone().sub(tgt));
  sph.theta += THREE.MathUtils.degToRad(INTRO_SWING_DEG);
  const from = new THREE.Vector3().setFromSpherical(sph).add(tgt);
  introRunning = true;                         // the chip must not flash during the swing
  flyTo(from, tgt, 0);
  const seq = flySeq;                          // abandon if anything else moves the camera
  setTimeout(() => {
    if (flySeq !== seq) { introRunning = false; return; }
    flyTo(pos, tgt, INTRO_MS);
    setTimeout(() => { introRunning = false; updateResetChip(); }, INTRO_MS + 60);
  }, INTRO_HOLD_MS);
}

let firstFrame = true;
function frameStage(st) {
  applyViewportFov();
  markSeqViewButton(null);          // a stage change is not one of the walk-around views
  const { pos, tgt } = poseFor(st);
  if (firstFrame) { firstFrame = false; introSwing(pos, tgt); }
  else flyTo(pos, tgt, MOVE_MS);
}

/* the Front/Back/Left/Right buttons for the Part 5 dollhouse */
function setSeqView(view) {
  const v = SEQ_VIEWS[view];
  if (!v) return;
  const tgt = new THREE.Vector3(SEQ_VIEW_TARGET[0], SEQ_VIEW_TARGET[1], SEQ_VIEW_TARGET[2]);
  const pos = new THREE.Vector3(v[0], v[1], v[2]);
  if (camera.aspect < 1) pos.sub(tgt).multiplyScalar(PORTRAIT_BACKOFF).add(tgt);
  markSeqViewButton(view);
  flyTo(pos, tgt, MOVE_MS);
}

function markSeqViewButton(view) {
  for (const b of document.querySelectorAll('#viewbar button[data-view]'))
    b.classList.toggle('active', b.dataset.view === view);
}

/* ---- Reset view ------------------------------------------------------
   No camera lock during quizzes — exploring matters — but a chip appears
   as soon as the learner has drifted well away from the stage pose. ---- */
const resetChip = document.getElementById('resetview');

function driftedFromPose() {
  if (!currentStage) return false;
  const { pos, tgt } = poseFor(currentStage);
  return camera.position.distanceTo(pos) > 4 || controls.target.distanceTo(tgt) > 1.5;
}
function updateResetChip() {
  if (!resetChip) return;
  if (flying || introRunning) return;          // don't flicker mid-glide
  resetChip.classList.toggle('hidden', !driftedFromPose());
}
function resetView() {
  if (!currentStage) return;
  const { pos, tgt } = poseFor(currentStage);
  markSeqViewButton(null);
  flyTo(pos, tgt, RESET_MS);
}
if (resetChip) resetChip.onclick = resetView;

let dragging = false;
controls.addEventListener('change', updateResetChip);
controls.addEventListener('start', () => {
  dragging = true; flySeq++;                   // a touch of the mouse abandons a pending intro swing
  markSeqViewButton(null);
});
controls.addEventListener('end', () => { dragging = false; updateResetChip(); });

/* rotate the camera about the orbit target — doc 07 binds this to the
   arrow keys so the scene is reachable without a pointer */
function orbitBy(dAzDeg, dPolDeg) {
  const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  sph.theta += THREE.MathUtils.degToRad(dAzDeg);
  sph.phi = THREE.MathUtils.clamp(
    sph.phi + THREE.MathUtils.degToRad(dPolDeg), controls.minPolarAngle, controls.maxPolarAngle);
  camera.position.setFromSpherical(sph).add(controls.target);
  controls.update();
}

function doorsSolved() {
  const ud = groups[currentIndex]?.userData;
  return !!ud && ud.blankStates.length > 0 && ud.blankStates.every(s => s.solved);
}
function allSolved() {
  const ud = groups[currentIndex]?.userData;
  if (!ud) return false;
  const doorsDone = ud.blankStates.every(s => s.solved);
  const bldDone = !ud.buildingState || ud.buildingState.solved;
  return (ud.blankStates.length > 0 || ud.buildingState) && doorsDone && bldDone;
}

function showStage(i) {
  currentIndex = i;
  currentStage = STAGES[i];
  for (const b of jumpBtns) b.classList.toggle('active', Number(b.dataset.part) === currentStage.part);
  if (!groups[i]) groups[i] = buildStageGroup(i);
  for (const k in groups) groups[k].visible = (Number(k) === i);
  blanks = groups[i].userData.raycastList;

  closeQuiz();
  ui.next.classList.add('hidden');
  ui.continueBtn.classList.add('hidden');
  ui.back.classList.add('hidden');
  controls.autoRotate = false;

  if (currentStage.kind === 'example') {
    const p = currentStage.part;
    ui.prompt.innerHTML = p === 5 ? EXAMPLE5_PROMPT : p === 4 ? EXAMPLE4_PROMPT : p === 3 ? EXAMPLE3_PROMPT
      : p === 2 ? EXAMPLE2_PROMPT : EXAMPLE_PROMPT;
    ui.continueBtn.textContent = p > 1 ? 'Ready ▸' : 'Continue ▸';
    ui.continueBtn.classList.remove('hidden');
    if (currentIndex > 0) ui.back.classList.remove('hidden');
  } else {
    const p = currentStage.part;
    if (p === 2)
      ui.prompt.innerHTML = `<b>Building ${currentStage.label} · ${currentStage.difficulty}</b> — the first digit is the floor. ` +
        `Click a door marked <b>?</b>, then pick its correct unit number on the right.`;
    else if (p === 3)
      ui.prompt.innerHTML = `<b>Building ${currentStage.label}</b> — fill in the missing unit numbers, then name the building. ` +
        `Click a door showing a <b>partial number</b> and pick the full number on the right.`;
    else if (p === 4)
      ui.prompt.innerHTML = `<b>Building ${currentStage.building}</b> — numbers wrap around the front <i>and</i> back. ` +
        `<b>Drag to spin around</b>, then click any door showing a <b>partial number</b> and pick the full unit.`;
    else if (p === 5)
      ui.prompt.innerHTML = `<b>Building ${currentStage.building}</b> — floor numbers don't exist here; the units just count up around the building. ` +
        `<b>Find the pattern and fill in the blanks.</b> Use the <b>Front / Back / Left / Right</b> buttons to navigate, ` +
        `drag to look around, and pinch to zoom. Click a door with a <b>partial number</b> and pick the full unit.`;
    else
      ui.prompt.innerHTML = `<b>Building ${currentStage.number}</b> — keep the pattern going. ` +
        `Click a door marked <b>?</b>, then pick its correct unit number from the options on the right.`;
    ui.back.classList.remove('hidden');
  }
  ui.prompt.classList.remove('hidden');

  if (currentStage.type === 'seq') ui.viewbar.classList.remove('hidden');
  else ui.viewbar.classList.add('hidden');

  frameStage(currentStage);

  if (currentStage.kind === 'quiz') resumeQuizState();
}

/* re-entering a quiz: pick up where the learner left off (door blanks, then
   the building-number step, then the Next button) */
function resumeQuizState() {
  const ud = groups[currentIndex].userData;
  if (!ud.blankStates.every(s => s.solved)) return;   // still has doors to fill
  if (ud.buildingState && !ud.buildingState.solved) {
    ui.prompt.innerHTML = `All units filled in — now <b>choose the building number</b>.`;
    openQuiz(ud.buildingState);
  } else {
    showNext();   // already finished (no confetti on a revisit)
  }
}

/* ---- quiz interaction ---- */
/* ---- quiz panel: option formatting, feedback, auto-close ---- */

/* one short rule per part, appended after a second wrong pick on the same blank */
const RULE_BY_PART = {
  1: 'Doors count on in order.',
  2: 'First digit = floor.',
  3: 'Leading digits = building.',
  4: 'Building, then floor, then door.',
  5: 'One count runs around the whole building.',
};

/* which kind of question is open: the stage type, or 'building' for the
   name-the-building step */
function quizType(bstate) {
  const ud = groups[currentIndex] && groups[currentIndex].userData;
  if (ud && ud.buildingState === bstate) return 'building';
  return currentStage ? currentStage.type : 'plex';
}

/* digit places of a unit number -> [{text, place}].
   Doc 09 owns splitPlaces(); until it lands we split locally so the colours
   still teach. When it exists, it wins. */
function quizPlaces(val, type) {
  const s = String(val);
  if (typeof splitPlaces === 'function') {
    const segs = splitPlaces(s, type);
    if (segs && segs.length) return segs;
  }
  if (type === 'building') return [{ text: s, place: 'building' }];
  if (type === 'tower' && s.length >= 3)
    return [{ text: s.slice(0, -2), place: 'floor' },
            { text: s.slice(-2), place: 'door' }];
  if ((type === 'row' || type === 'block') && s.length >= 4)
    return [{ text: s.slice(0, -3), place: 'building' },
            { text: s.slice(-3, -2), place: 'floor' },
            { text: s.slice(-2), place: 'door' }];
  if (type === 'seq' && s.length >= 3)
    return [{ text: s.slice(0, -2), place: 'building' },
            { text: s.slice(-2), place: 'door' }];
  return [{ text: s, place: 'door' }];
}

function optionHTML(idx, val, type) {
  const segs = quizPlaces(val, type);
  return `<span class="ltr">${'abcd'[idx]}</span><span class="num">` +
    segs.map(sg => `<span class="pl pl-${sg.place}">${sg.text}</span>`).join('') + '</span>';
}

/* the digit key above the options: one chip per place actually in play */
function renderQuizKey(type, segs) {
  const key = document.getElementById('qkey');
  if (!key) return;
  const show = type === 'building' || type === 'tower' || type === 'row' ||
               type === 'block' || type === 'seq';
  if (!show) { key.classList.add('hidden'); return; }
  const places = [];
  for (const sg of segs) if (!places.includes(sg.place)) places.push(sg.place);
  key.innerHTML = places.map(pl => `<span class="pl pl-${pl}">${pl}</span>`).join('');
  key.classList.remove('hidden');
}

/* why the pick was wrong, in <= 12 words — never reveals the answer */
function explainWrong(chosen, correct, type) {
  if (type === 'building') return 'Look at the digits every unit shares.';
  if (type === 'plex') return 'Count on from the door next to it.';
  if (type === 'seq') return 'No floor digit here — count on from the nearest known door.';
  const a = quizPlaces(chosen, type), b = quizPlaces(correct, type);
  const at = pl => { const sg = a.find(x => x.place === pl); return sg ? sg.text : null; };
  const bt = pl => { const sg = b.find(x => x.place === pl); return sg ? sg.text : null; };
  if (type === 'tower') {
    if (at('floor') !== bt('floor')) return 'Right column, wrong floor — the first digit is the floor.';
    if (at('door') !== bt('door')) return 'Right floor — count along the doors again.';
  } else if (type === 'row' || type === 'block') {
    if (at('building') !== bt('building')) return 'Right floor and door — check the leading digits: the building.';
    if (at('floor') !== bt('floor')) return 'Right building, wrong floor.';
    if (at('door') !== bt('door')) return 'Right building and floor — count the doors again.';
  }
  return 'Not quite — read the pattern again.';
}

/* auto-close after a correct answer: fast, but never taken from someone who is
   still hovering or keyboard-focused inside the panel (and then never re-armed) */
let quizCloseTimer = null;
function cancelAutoClose() {
  if (quizCloseTimer !== null) { clearTimeout(quizCloseTimer); quizCloseTimer = null; }
}
function armAutoClose(bstate) {
  cancelAutoClose();
  quizCloseTimer = setTimeout(() => {
    quizCloseTimer = null;
    if (activeBlank && activeBlank !== bstate) return;   // another question took over
    const reading = ui.quiz.matches(':hover') || ui.quiz.contains(document.activeElement);
    if (reading) return;                                 // still being read — stays put
    closeQuiz();
  }, 1100);
}

document.getElementById('qclose').onclick = () => closeQuiz();

function openQuiz(bstate) {
  if (bstate.solved) return;
  cancelAutoClose();
  activeBlank = bstate;
  const type = quizType(bstate);
  ui.qhead.innerHTML = bstate.header || 'Which unit is this?<small>Pick the number that matches the pattern</small>';
  renderQuizKey(type, quizPlaces(bstate.value, type));
  ui.qopts.innerHTML = '';
  bstate.options.forEach((val, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = optionHTML(idx, val, type);
    btn.onclick = ev => chooseOption(bstate, val, btn, ev);
    ui.qopts.appendChild(btn);
  });
  ui.qmsg.textContent = '';
  ui.qmsg.className = '';
  ui.quiz.classList.remove('hidden');
  document.dispatchEvent(new CustomEvent('quizopen', { detail: { bstate } }));
}

function chooseOption(bstate, val, btn, ev) {
  if (bstate !== activeBlank || bstate.solved) return;
  const type = quizType(bstate);
  if (val === bstate.value) {
    bstate.solved = true;
    setPlateText(bstate.plate,
      bstate.solvedText ? bstate.solvedText(val) : String(val),
      bstate.plateOpts || {});
    btn.classList.add('right');
    [...ui.qopts.children].forEach(b => b.disabled = true);
    ui.qmsg.textContent = `✓ Correct — ${val}`;
    ui.qmsg.className = 'ok';
    // a mouse click leaves focus on the option; drop it so the auto-close
    // "still reading" test only holds for real keyboard users
    if (ev && ev.detail > 0 && document.activeElement === btn) btn.blur();
    checkComplete(bstate);
    if (activeBlank === bstate) armAutoClose(bstate);
  } else {
    btn.disabled = true;
    btn.classList.add('wrong');
    bstate.wrongCount = (bstate.wrongCount || 0) + 1;
    let msg = explainWrong(val, bstate.value, type);
    const rule = currentStage && RULE_BY_PART[currentStage.part];
    if (bstate.wrongCount >= 2 && rule) msg += ' ' + rule;
    ui.qmsg.textContent = msg;
    ui.qmsg.className = 'bad';
  }
}

function closeQuiz() {
  cancelAutoClose();
  activeBlank = null;
  ui.quiz.classList.add('hidden');
  document.dispatchEvent(new CustomEvent('quizclose', { detail: {} }));
}

function checkComplete() {
  if (!doorsSolved()) return;
  const bs = groups[currentIndex].userData.buildingState;
  if (bs && !bs.solved) {                     // all units in — now name the building
    ui.prompt.innerHTML = `Nice — every unit is filled in. Now <b>choose the building number</b>.`;
    openQuiz(bs);
    return;
  }
  if (!celebrated.has(currentIndex)) {
    celebrated.add(currentIndex);
    fireConfetti();
  }
  showNext();
}

function showNext() {
  const isLast = currentIndex === STAGES.length - 1;
  const nextStage = STAGES[currentIndex + 1];
  if (isLast) ui.next.textContent = 'Start Over ▸';
  else if (nextStage && nextStage.kind === 'example') ui.next.textContent = `Next: Part ${nextStage.part} ▸`;
  else ui.next.textContent = 'Next Building ▸';
  ui.next.classList.remove('hidden');
}

/* ---- buttons ---- */
function resetCourse() {
  for (const k of Object.keys(groups)) {
    const g = groups[k];
    scene.remove(g);
    g.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { o.material.map?.dispose(); o.material.dispose(); }
    });
    delete groups[k];
  }
  celebrated.clear();
}

ui.continueBtn.onclick = () => showStage(currentIndex + 1);
ui.back.onclick = () => showStage(Math.max(0, currentIndex - 1));
ui.next.onclick = () => {
  if (currentIndex < STAGES.length - 1) showStage(currentIndex + 1);
  else { resetCourse(); showStage(0); } // "Start Over" — fresh run from Part 1
};

/* ---- click a blank door/plate to open its options ---- */
let downPos = null;
renderer.domElement.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 6 || currentStage.kind !== 'quiz') return; // a drag, or no quiz here

  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  for (const h of raycaster.intersectObjects(blanks, false)) {
    const bs = h.object.userData.bstate;
    if (bs && !bs.solved) { openQuiz(bs); return; }
  }
});

/* ============================================================
   confetti (lightweight 2D canvas overlay)
   ============================================================ */
const cc = document.createElement('canvas');
cc.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:50';
document.body.appendChild(cc);
const cctx = cc.getContext('2d');
function sizeConfetti() { cc.width = innerWidth; cc.height = innerHeight; }
sizeConfetti();

let confetti = [];
function fireConfetti() {
  const colors = ['#ff5252', '#ffd54a', '#57c97e', '#42a5f5', '#ab47bc', '#ff9800'];
  for (let i = 0; i < 170; i++) {
    confetti.push({
      x: innerWidth / 2 + (Math.random() - 0.5) * 240,
      y: innerHeight * 0.32,
      vx: (Math.random() - 0.5) * 10,
      vy: -7 - Math.random() * 9,
      g: 0.22 + Math.random() * 0.12,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.45,
      w: 6 + Math.random() * 7, h: 8 + Math.random() * 9,
      color: colors[i % colors.length],
    });
  }
}
function drawConfetti() {
  cctx.clearRect(0, 0, cc.width, cc.height);
  if (!confetti.length) return;
  confetti = confetti.filter(p => p.y < innerHeight + 40);
  for (const p of confetti) {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    cctx.save();
    cctx.translate(p.x, p.y); cctx.rotate(p.rot);
    cctx.fillStyle = p.color;
    cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cctx.restore();
  }
}

/* ============================================================
   accessibility (doc 07) — keyboard, focus, ARIA, scene text
   ============================================================ */
const sceneDescEl = document.getElementById('scene-desc');
const doorListEl = document.getElementById('doorlist');

/* the canvas is a real, focusable image with a text description */
renderer.domElement.tabIndex = 0;
renderer.domElement.setAttribute('role', 'img');
renderer.domElement.setAttribute('aria-label', '3D view of the building. Use arrow keys to look around.');
renderer.domElement.setAttribute('aria-describedby', 'scene-desc');

/* ---- scene description + a keyboard door list ---- */
/* doc 10 toggles the .active class on the jump buttons; the ARIA state is ours */
function a11yMarkCurrentPart() {
  if (!currentStage) return;
  for (const b of jumpBtns) {
    if (Number(b.dataset.part) === currentStage.part) b.setAttribute('aria-current', 'true');
    else b.removeAttribute('aria-current');
  }
}
const A11Y_ORD = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth'];

/* which wall a plate sits on, from its yaw */
function a11yFace(plate) {
  const y = ((plate.rotation.y % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  if (Math.abs(y - Math.PI / 2) < 0.4) return 'right';
  if (Math.abs(y - Math.PI * 1.5) < 0.4) return 'left';
  if (Math.abs(y - Math.PI) < 0.4) return 'back';
  return 'front';
}
/* position along that wall, increasing left-to-right as the viewer sees it */
function a11yAlong(plate, face) {
  const p = plate.position;
  return face === 'front' ? p.x : face === 'back' ? -p.x : face === 'left' ? p.z : -p.z;
}
/* every floor in the course is 3.2 units high and plates sit ~2.5 above it */
function a11yFloor(plate) { return Math.round((plate.position.y - 2.5) / 3.2) + 1; }
/* every number plate in a building group: a flat sign sitting one plate-height
   above a floor slab (this skips roof banners, side signs, arrows and windows) */
function a11yPlates(group) {
  const out = [];
  group.traverse(o => {
    if (!o.isMesh || !o.geometry || o.geometry.type !== 'PlaneGeometry') return;
    const k = Math.round((o.position.y - 2.5) / 3.2);
    if (k >= 0 && Math.abs(o.position.y - (2.5 + 3.2 * k)) < 0.15) out.push(o);
  });
  return out;
}

/* the partial number printed on a blank plate, taken from the stage data */
function a11yMask(bstate) {
  const st = currentStage;
  if (!st) return '?';
  if (st.type === 'row' && st.floors) {
    for (const row of st.floors)
      for (const cell of row)
        if (Array.isArray(cell) && cell[0] === bstate.value) return cell[1];
  } else if (st.type === 'block' && st.blanks) {
    return st.blanks[bstate.value] || '?';
  } else if (st.type === 'seq' && st.blanks) {
    return st.blanks[bstate.value - st.base] || '?';
  }
  return '?';
}
function a11ySpokenMask(mask) {
  if (mask === '?') return 'no number yet';
  return mask.replace(/_+/g, ' blank ').replace(/\s+/g, ' ').trim();
}

/* ---- one sentence describing the building the camera is looking at ---- */
function a11yStageText() {
  const st = currentStage;
  if (!st) return '';
  const ud = groups[currentIndex] && groups[currentIndex].userData;
  let text;
  if (st.type === 'tower') {
    const lo = 100 + Math.min(...st.suffixes), hi = 400 + Math.max(...st.suffixes);
    text = `Four-storey building ${st.label} with three doors per floor, unit numbers ${lo} to ${hi}; ` +
           `the first digit is the floor.`;
  } else if (st.type === 'row') {
    const all = st.floors.flat().map(c => (Array.isArray(c) ? c[0] : c));
    const named = st.kind === 'example' || !st.chooseBuilding;
    text = `Two-storey ${named ? `building ${st.building}` : 'building, its number still hidden,'} ` +
           `with five doors per floor, unit numbers ${Math.min(...all)} to ${Math.max(...all)}; ` +
           `the leading digits name the building and the next digit is the floor.`;
  } else if (st.type === 'block') {
    text = `Four-storey building ${st.building}, two doors per floor on the front and two more directly behind them; ` +
           `five-digit units where the leading digits are the building, then the floor, then the door.`;
  } else if (st.type === 'seq') {
    text = `Three-storey building ${st.building} with twenty doors around all four sides, ` +
           `unit numbers ${st.base + 1} to ${st.base + 20}; one running count with no floor digit.`;
  } else {
    const last = st.kind === 'example' ? st.start + 7 : st.start + 3;
    text = `Two-storey building ${st.number} with four doors, two on each floor, ` +
           `unit numbers ${st.start} to ${last} counting up in order.`;
  }
  if (st.kind === 'example') return text + ' This is a worked example — every door already shows its number.';
  const left = ud ? ud.blankStates.filter(b => !b.solved).length : 0;
  const bld = ud && ud.buildingState && !ud.buildingState.solved;
  if (left) return `${text} ${left} door${left === 1 ? ' is' : 's are'} blank — use the door list to fill ${left === 1 ? 'it' : 'them'} in.`;
  if (bld) return `${text} Every door is filled in — now choose the building number.`;
  return `${text} Every door is filled in.`;
}

function a11yDescribeStage() {
  if (!sceneDescEl) return;
  const text = a11yStageText();
  if (sceneDescEl.textContent !== text) sceneDescEl.textContent = text;
}

/* ---- a real button per unsolved blank, so Tab reaches every door ---- */
function a11yRebuildDoorList() {
  if (!doorListEl) return;
  doorListEl.innerHTML = '';
  const ud = groups[currentIndex] && groups[currentIndex].userData;
  if (!ud || !currentStage || currentStage.kind !== 'quiz') return;

  // rank every blank among ALL the plates sharing its floor and wall
  const rank = new Map();
  const buckets = new Map();
  for (const plate of a11yPlates(groups[currentIndex])) {
    const key = a11yFace(plate) + '/' + a11yFloor(plate);
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(plate);
  }
  for (const [key, list] of buckets) {
    const face = key.split('/')[0];
    list.sort((x, y) => a11yAlong(x, face) - a11yAlong(y, face));
    list.forEach((plate, i) => rank.set(plate, i));
  }

  // read them out in walking order: front wall first, then left, back, right
  const faceOrder = { front: 0, left: 1, back: 2, right: 3 };
  const open = ud.blankStates.filter(b => !b.solved).sort((x, y) => {
    const fx = a11yFace(x.plate), fy = a11yFace(y.plate);
    return (faceOrder[fx] - faceOrder[fy]) || (a11yFloor(x.plate) - a11yFloor(y.plate)) ||
           (a11yAlong(x.plate, fx) - a11yAlong(y.plate, fy));
  });

  for (const b of open) {
    const face = a11yFace(b.plate), floor = a11yFloor(b.plate);
    const pos = rank.has(b.plate) ? rank.get(b.plate) : 0;
    const ord = A11Y_ORD[pos] || `number ${pos + 1}`;
    const mask = a11yMask(b);
    const where = `floor ${floor}, ${ord} from the left on the ${face}`;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = `Door showing ${mask.replace(/_/g, '▢')}, ${where} — open its options`;
    btn.setAttribute('aria-label', `Door showing ${a11ySpokenMask(mask)}, ${where} — open its options`);
    btn.onclick = () => openQuiz(b);
    doorListEl.appendChild(btn);
  }

  const bs = ud.buildingState;
  if (bs && !bs.solved && ud.blankStates.every(x => x.solved)) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Choose the building number — open its options';
    btn.onclick = () => openQuiz(bs);
    doorListEl.appendChild(btn);
  }
}

/* ---- focus management + keyboard map ---- */
let a11yReturnFocus = null;

function a11yOnQuizOpen() {
  const prev = document.activeElement;
  if (prev && prev !== document.body && !ui.quiz.contains(prev)) a11yReturnFocus = prev;
  setTimeout(() => {
    const first = ui.qopts.querySelector('button.opt:not([disabled])');
    if (first) first.focus();
  }, 0);
}
function a11yOnQuizClose() {
  const back = a11yReturnFocus;
  a11yReturnFocus = null;
  setTimeout(() => {
    if (back && back.isConnected) back.focus();
    else renderer.domElement.focus();
  }, 0);
}

/* orbit by keyboard. doc 02 owns orbitBy(); until it lands, turn the camera
   here so the arrow keys still work. */
function a11yOrbit(dAz, dEl) {
  if (typeof orbitBy === 'function') { orbitBy(dAz, dEl); return; }
  const off = camera.position.clone().sub(controls.target);
  const sph = new THREE.Spherical().setFromVector3(off);
  sph.theta += dAz * Math.PI / 180;
  sph.phi = Math.min(Math.max(sph.phi + dEl * Math.PI / 180, 0.08), controls.maxPolarAngle);
  camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sph));
  controls.update();
}
function a11yResetView() {
  if (typeof resetView === 'function') resetView();
  else if (currentStage) frameStage(currentStage);
}

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const quizOpen = !!activeBlank && !ui.quiz.classList.contains('hidden');

  if (quizOpen) {
    if (e.key === 'Escape') { e.preventDefault(); closeQuiz(); return; }
    const opts = [...ui.qopts.querySelectorAll('button.opt:not([disabled])')];
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && opts.length) {
      e.preventDefault();
      const step = e.key === 'ArrowDown' ? 1 : -1;
      const at = opts.indexOf(document.activeElement);
      const to = at < 0 ? (step > 0 ? 0 : opts.length - 1) : (at + step + opts.length) % opts.length;
      opts[to].focus();
      return;
    }
    const k = e.key.toLowerCase();
    const idx = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
    if (idx >= 0) {
      const btn = [...ui.qopts.querySelectorAll('button.opt')][idx];
      if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
      return;
    }
    return;   // the quiz owns the keyboard while it is open
  }

  if (e.key === 'Home') { e.preventDefault(); a11yResetView(); return; }

  // camera keys only from the canvas or the page background — never steal
  // Enter/Space/arrows from another control
  if (t && t !== document.body && t !== renderer.domElement &&
      typeof t.closest === 'function' && t.closest('button, a[href], [tabindex]:not(canvas)')) return;

  switch (e.key) {
    case 'ArrowLeft':  e.preventDefault(); a11yOrbit(-15, 0); break;
    case 'ArrowRight': e.preventDefault(); a11yOrbit(15, 0); break;
    case 'ArrowUp':    e.preventDefault(); a11yOrbit(0, -10); break;
    case 'ArrowDown':  e.preventDefault(); a11yOrbit(0, 10); break;
    default: {
      if (!currentStage || currentStage.type !== 'seq') return;
      const view = { f: 'front', b: 'back', l: 'left', r: 'right' }[e.key.toLowerCase()];
      if (view && typeof setSeqView === 'function') { e.preventDefault(); setSeqView(view); }
    }
  }
});

/* ---- wiring: the doc 05/10 events when they exist, a cheap poll otherwise.
   Every handler is idempotent, so firing from both sources is harmless. ---- */
let a11ySig = null, a11yQuizWasOpen = false;
function a11ySync() {
  const ud = groups[currentIndex] && groups[currentIndex].userData;
  const sig = currentIndex + '|' +
    (ud ? ud.blankStates.filter(b => b.solved).length + '/' + ud.blankStates.length : '-') + '|' +
    (ud && ud.buildingState ? (ud.buildingState.solved ? 'b1' : 'b0') : '-');
  if (sig !== a11ySig) {
    a11ySig = sig;
    a11yMarkCurrentPart();
    a11yDescribeStage();
    a11yRebuildDoorList();
  }
  const open = !!activeBlank && !ui.quiz.classList.contains('hidden');
  if (open !== a11yQuizWasOpen) {
    a11yQuizWasOpen = open;
    if (open) a11yOnQuizOpen(); else a11yOnQuizClose();
  }
}
for (const ev of ['stagechange', 'blanksolved', 'quizopen', 'quizclose'])
  document.addEventListener(ev, a11ySync);
setInterval(a11ySync, 200);

/* ============================================================
   loop + resize
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  applyViewportFov();
  // re-frame on orientation / window changes, unless a drag is under way
  if (currentStage && !dragging) { const { pos, tgt } = poseFor(currentStage); flyTo(pos, tgt, 0); }
  sizeConfetti();
});
(function tick() {
  controls.update();
  renderer.render(scene, camera);
  drawConfetti();
  requestAnimationFrame(tick);
})();

showStage(0);
</script>
</body>
</html>
